name: Reader V3 final perf cut

on:
  push:
    branches:
      - feat/reader-v3-prelaunch-final
    paths:
      - .github/workflows/reader-v3-final-perf-cut.yml

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/reader-v3-prelaunch-final

      - name: Apply and verify final performance cut
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reader_v3_final_perf_cut.py
          bash scripts/verify-reader-v3.sh
          python3 scripts/verify-reader-profile-contract.py
          git diff --check

      - name: Commit final cut and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reader-v3-final-perf-cut.yml scripts/reader_v3_final_perf_cut.py
          git add \
            apps/android/app/src/main/java/com/junchen/jingdu/ReaderFastText.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/ReaderScreenV3.kt \
            apps/android/app/src/main/baseline-prof.txt \
            scripts/verify-reader-profile-contract.py \
            docs/READER_V3_PROFILE_PROVENANCE.md
          git diff --cached --check
          git commit -m 'perf(android): finalize Reader V3 frame hot paths'
          git push origin HEAD:feat/reader-v3-prelaunch-final
