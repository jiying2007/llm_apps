name: Reader UX contract migrate

on:
  push:
    branches: [ux/reader-comprehensive]

permissions:
  contents: write

concurrency:
  group: reader-ux-contract-migrate
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Replace obsolete consumed-pointer contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-reader.sh')
          s = p.read_text()
          old = "require_literal \"$screen\" '!consumedByChild && settings.swipePagingEnabled' 'consumed drag protection'\n"
          new = (
              "require_literal \"$screen\" 'ReaderGesturePolicy.allowsPageSwipe' 'selection-aware consumed drag arbitration'\n"
              "require_literal \"$screen\" 'pendingCenterTap = launch' 'delayed center single-tap arbitration'\n"
              "require_literal \"$fast_text\" 'selectionMode: Boolean? = null' 'selection fallback lifecycle ownership'\n"
          )
          if s.count(old) != 1:
              raise SystemExit(f'expected one obsolete gesture contract, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git rm .github/workflows/reader-ux-contract-migrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-reader.sh
          git commit -m 'ci: align Reader contracts with interaction-safe gestures'
          git push origin HEAD:ux/reader-comprehensive
