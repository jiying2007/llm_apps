name: Reader benchmark observability migration

on:
  push:
    branches:
      - "ux/reader-comprehensive"
    paths:
      - ".github/workflows/reader-benchmark-observability-migrate.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ux/reader-comprehensive
          fetch-depth: 0
      - run: python3 scripts/migrate-reader-benchmark-observability.py
      - run: git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reader-benchmark-observability-migrate.yml scripts/migrate-reader-benchmark-observability.py
          git add apps/android/macrobenchmark/src/main/java/com/junchen/jingdu/macrobenchmark/ReaderJourneyBenchmark.kt
          git commit -m 'test: verify reader controls with multi-signal visibility'
          git push origin HEAD:ux/reader-comprehensive
