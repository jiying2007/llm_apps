name: Finalize Content Addressing

on:
  push:
    branches: [feat/android-harmony-terminal]
    paths:
      - '.github/workflows/finalize-content-addressing.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/android-harmony-terminal
      - name: Finalize Android immutable revision wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          repo = Path('apps/android/app/src/main/java/com/junchen/jingdu/BookRepository.java')
          text = repo.read_text()
          old = '''    void pruneCleanRevisions(Book book, String keepRevision) {
              String keepName = "clean-" + keepRevision + ".txt";
              File[] files = directory(book.id).listFiles();
              if (files == null) return;
              for (File file : files) {
                  String name = file.getName();
                  if (name.startsWith("clean-") && name.endsWith(".txt") && !name.equals(keepName)) {
                      deleteTemporary(file);
                  }
              }
          }
          '''
          new = '''    void pruneCleanRevisions(Book book, File keep) {
              File[] files = directory(book.id).listFiles();
              if (files == null) return;
              for (File file : files) {
                  String name = file.getName();
                  if (name.startsWith("clean-") && name.endsWith(".txt") && !file.equals(keep)) {
                      deleteTemporary(file);
                  }
              }
          }
          '''
          if old not in text:
              raise SystemExit('BookRepository prune block not found')
          repo.write_text(text.replace(old, new))

          activity = Path('apps/android/app/src/main/java/com/junchen/jingdu/MainActivity.java')
          text = activity.read_text()
          text = text.replace(
              'private record OpenedBook(BookRepository.Book book, ReaderController reader, boolean clean) {}',
              'private record OpenedBook(BookRepository.Book book, ReaderController reader, boolean clean, File contentFile) {}')
          old = '''                OpenedBook opened = new OpenedBook(book, candidate, clean);
                          main.post(() -> {
                              if (isDestroyed() || token != workGeneration.get()) {
                                  opened.reader().close();
                                  return;
                              }
                              ReaderController old = reader;
                              reader = opened.reader();
                              currentBook = opened.book();
                              cleanMode = opened.clean();
                              busy = false;
                              old.close();
                              render();
                          });'''
          new = '''                OpenedBook opened = new OpenedBook(book, candidate, clean, file);
                          main.post(() -> {
                              if (isDestroyed() || token != workGeneration.get()) {
                                  opened.reader().close();
                                  return;
                              }
                              ReaderController old = reader;
                              reader = opened.reader();
                              currentBook = opened.book();
                              cleanMode = opened.clean();
                              busy = false;
                              old.close();
                              repository.pruneDocumentRevisions(opened.book());
                              if (opened.clean()) {
                                  repository.pruneCleanRevisions(opened.book(), opened.contentFile());
                              }
                              render();
                          });'''
          if old not in text:
              raise SystemExit('MainActivity publish block not found')
          text = text.replace(old, new)
          old = '''    private File buildClean(BookRepository.Book book) throws IOException {
              File output = repository.cleanPreviewFile(book);
              String packedRules = rulesFor(book);
              String revision = repository.repairRevision(book, packedRules);
              File revisionFile = new File(output.getParentFile(), "clean.revision");
              if (output.isFile() && revisionFile.isFile()) {
                  try (FileInputStream input = new FileInputStream(revisionFile)) {
                      byte[] data = new byte[(int) Math.min(128, revisionFile.length())];
                      int count = input.read(data);
                      if (count > 0 && revision.equals(new String(
                              data, 0, count, java.nio.charset.StandardCharsets.UTF_8))) {
                          return output;
                      }
                  }
              }
              try (ReaderController source = new ReaderController()) {
                  source.open(repository.normalizedFile(book), 0);
                  source.exportRules(packedRules, output);
              }
              try (java.io.FileOutputStream revisionOut = new java.io.FileOutputStream(revisionFile)) {
                  revisionOut.write(revision.getBytes(java.nio.charset.StandardCharsets.UTF_8));
                  revisionOut.getFD().sync();
              }
              return output;
          }
          '''
          new = '''    private File buildClean(BookRepository.Book book) throws IOException {
              String packedRules = rulesFor(book);
              String revision = repository.repairRevision(book, packedRules);
              File output = repository.cleanFile(book, revision);
              if (output.isFile()) return output;
              try (ReaderController source = new ReaderController()) {
                  source.open(repository.normalizedFile(book), 0);
                  source.exportRules(packedRules, output);
              }
              return output;
          }
          '''
          if old not in text:
              raise SystemExit('MainActivity clean block not found')
          activity.write_text(text.replace(old, new))
          PY
          ! grep -R -n -E 'cleanPreviewFile|clean\.revision|"document\.txt"|"clean\.txt"' \
            apps/android/app/src/main/java/com/junchen/jingdu
          git diff --check
      - name: Commit Android finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/android/app/src/main/java/com/junchen/jingdu/BookRepository.java \
                  apps/android/app/src/main/java/com/junchen/jingdu/MainActivity.java
          git commit -m 'refactor(android): finalize immutable document revisions'
          git push origin HEAD:feat/android-harmony-terminal
