name: Upgrade Gradle Wrapper

on:
  push:
    branches: [feat/android-harmony-terminal]
    paths:
      - '.github/workflows/upgrade-gradle-wrapper.yml'

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/android-harmony-terminal
      - name: Install verified Gradle 9.5 wrapper and AGP 9.3.1
        shell: bash
        run: |
          set -euo pipefail
          JAR=apps/android/gradle/wrapper/gradle-wrapper.jar
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/gradle/gradle/v9.5.0/gradle/wrapper/gradle-wrapper.jar \
            --output "$JAR"
          echo '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  '"$JAR" | sha256sum --check --strict
          sed -i 's/version "9\.0\.1"/version "9.3.1"/' apps/android/build.gradle
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.5.0-bin.zip#' apps/android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's#distributionSha256Sum=.*#distributionSha256Sum=553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746#' apps/android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'version "9.3.1"' apps/android/build.gradle
          grep -q 'gradle-9.5.0-bin.zip' apps/android/gradle/wrapper/gradle-wrapper.properties
          sha256sum "$JAR"
      - name: Commit verified toolchain
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/android/build.gradle apps/android/gradle/wrapper/gradle-wrapper.properties apps/android/gradle/wrapper/gradle-wrapper.jar
          git diff --cached --check
          git commit -m 'build(android): upgrade AGP and Gradle toolchain'
          git push origin HEAD:feat/android-harmony-terminal
