name: Android Physical Release Performance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-physical-release-performance
  cancel-in-progress: false

jobs:
  reader-release-performance:
    runs-on: [self-hosted, android, physical]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Qualify Reader on physical Android release device
        run: bash ./scripts/run-android-physical-release-performance.sh
      - name: Preserve physical release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reader-physical-release-${{ github.sha }}
          path: apps/android/macrobenchmark/build/outputs/physical-release/
          if-no-files-found: warn
          retention-days: 30
