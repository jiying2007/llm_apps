name: Reader V3 Kotlin Syntax Fix

on:
  push:
    branches: [feat/reader-v3-prelaunch-final]
    paths: [.github/workflows/reader-v3-kotlin-syntax-fix.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/reader-v3-prelaunch-final
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/android/app/src/main/java/com/junchen/jingdu/ReaderScreenV3.kt')
          s = p.read_text()
          old = '    val prepared by produceState<ReaderPreparedPageV3?>(\n        initialValue = null,\n'
          new = '    val prepared by produceState<ReaderPreparedPageV3?>(\n        null,\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected one produceState syntax target, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          bash scripts/verify-reader-v3.sh
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reader-v3-kotlin-syntax-fix.yml
          git add apps/android/app/src/main/java/com/junchen/jingdu/ReaderScreenV3.kt
          git commit -m "fix(android): keep prepared page state call positional"
          git push origin HEAD:feat/reader-v3-prelaunch-final
