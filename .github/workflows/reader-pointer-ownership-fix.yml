name: Reader pointer ownership fix

on:
  push:
    branches: [ux/reader-comprehensive]
    paths: [.github/workflows/reader-pointer-ownership-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ux/reader-comprehensive
          fetch-depth: 0
      - name: Apply interaction fix and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {found}: {old[:100]!r}")
              p.write_text(text.replace(old, new, count))

          screen = "apps/android/app/src/main/java/com/junchen/jingdu/ReaderScreen.kt"
          replace(screen, "import androidx.compose.foundation.gestures.detectTransformGestures\n", "")
          replace(screen, "import kotlin.math.abs\nimport kotlin.math.roundToInt\n", "import kotlin.math.abs\nimport kotlin.math.hypot\nimport kotlin.math.roundToInt\n")
          replace(
              screen,
              ".readerGestures(settings, widthPx, heightPx, systemLeft, systemRight, onPrevious, onNext, onToggleControls, onBrightnessDelta, onBookmark)\n        .pointerInput(settings.pinchFontEnabled) {\n            if (settings.pinchFontEnabled) detectTransformGestures { _, _, zoom, _ -> onResizeFont(zoom) }\n        }",
              ".readerGestures(settings, widthPx, heightPx, systemLeft, systemRight, onPrevious, onNext, onToggleControls, onBrightnessDelta, onResizeFont, onBookmark)",
          )
          replace(
              screen,
              "    onToggleControls: () -> Unit,\n    onBrightnessDelta: (Float) -> Unit,\n    onBookmark: () -> Unit,",
              "    onToggleControls: () -> Unit,\n    onBrightnessDelta: (Float) -> Unit,\n    onResizeFont: (Float) -> Unit,\n    onBookmark: () -> Unit,",
          )
          replace(
              screen,
              "            var consumedByChild = down.isConsumed\n            var maxPointers = 1\n            do {\n                val event = awaitPointerEvent(PointerEventPass.Final)\n                maxPointers = maxOf(maxPointers, event.changes.size)\n                if (event.changes.any { it.isConsumed }) consumedByChild = true\n                event.changes.firstOrNull { it.id == down.id }?.let { last = it }\n            } while (last.pressed)\n            if (maxPointers > 1) return@awaitEachGesture",
              "            var consumedByChild = down.isConsumed\n            var maxPointers = 1\n            var initialPinchDistance: Float? = null\n            var latestPinchDistance: Float? = null\n            do {\n                val event = awaitPointerEvent(PointerEventPass.Final)\n                maxPointers = maxOf(maxPointers, event.changes.size)\n                if (event.changes.size >= 2) {\n                    val first = event.changes[0].position\n                    val second = event.changes[1].position\n                    val distance = hypot(\n                        (first.x - second.x).toDouble(),\n                        (first.y - second.y).toDouble(),\n                    ).toFloat()\n                    if (distance > 0f) {\n                        if (initialPinchDistance == null) initialPinchDistance = distance\n                        latestPinchDistance = distance\n                    }\n                }\n                if (event.changes.any { it.isConsumed }) consumedByChild = true\n                event.changes.firstOrNull { it.id == down.id }?.let { last = it }\n            } while (last.pressed)\n            if (maxPointers > 1) {\n                cancelPendingCenterTap()\n                if (settings.pinchFontEnabled) {\n                    val start = initialPinchDistance\n                    val end = latestPinchDistance\n                    if (start != null && end != null && start > 0f) {\n                        val zoom = end / start\n                        if (abs(zoom - 1f) >= 0.04f) onResizeFont(zoom)\n                    }\n                }\n                return@awaitEachGesture\n            }",
          )
          replace(
              screen,
              "                TextButton({ actions.onOpenPanel(ReaderPanel.QUICK_SETTINGS) }) { Text(\"Aa\") }",
              "                IconButton({ actions.onOpenPanel(ReaderPanel.QUICK_SETTINGS) }) {\n                    Icon(Icons.Outlined.TextFields, stringResource(R.string.reading_settings))\n                }",
          )

          ui = "apps/android/app/src/androidTest/java/com/junchen/jingdu/JingduUiTest.kt"
          replace(
              ui,
              "        composeRule.onNodeWithText(\"Aa\").assertIsDisplayed()",
              "        composeRule.onNodeWithContentDescription(context.getString(R.string.reading_settings)).assertIsDisplayed()",
          )

          journey = "apps/android/macrobenchmark/src/main/java/com/junchen/jingdu/macrobenchmark/ReaderJourneyBenchmark.kt"
          p = Path(journey)
          text = p.read_text()
          matches = text.count('By.text("Aa")')
          if matches < 3:
              raise SystemExit(f"{journey}: expected >=3 Aa selectors, found {matches}")
          p.write_text(text.replace('By.text("Aa")', 'By.desc("Reading settings")'))

          Path(".github/workflows/reader-pointer-ownership-fix.yml").unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: unify reader pointer gesture ownership'
          git push origin HEAD:ux/reader-comprehensive
