name: Reader V3 frame-boundary cut

on:
  push:
    branches:
      - feat/reader-v3-prelaunch-final
    paths:
      - .github/workflows/reader-v3-frame-boundaries.yml
      - scripts/apply-reader-v3-frame-boundaries.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: feat/reader-v3-prelaunch-final

      - name: Apply and verify Reader V3 frame boundaries
        shell: bash
        run: |
          python3 scripts/apply-reader-v3-frame-boundaries.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-reader-v3.sh')
          text = path.read_text()
          old = '''require_literal "$fast_text" 'content.translationY = -value' 'continuous RenderNode translation'
          '''
          new = '''require_literal "$fast_text" 'scrollTo(0, y)' 'continuous viewport scroll property'
          require_literal "$fast_text" 'content.setLayerType(View.LAYER_TYPE_HARDWARE, null)' 'continuous cached text layer'
          require_literal "$fast_text" 'content.buildLayer()' 'continuous text layer prebuild'
          forbid_literal "$fast_text" 'content.translationY = -value' 'continuous tall-child translation'
          forbid_literal "$fast_text" 'fun consumeDelta(delta: Float)' 'obsolete Compose scroll adapter'
          '''
          if old in text:
              text = text.replace(old, new, 1)
          old = '''require_literal "$app" 'ReaderHotPanelHost(hotPanel' 'isolated hot panel restart group'
          '''
          new = '''require_literal "$app" 'val hotPanelState: State<ReaderPanel?>' 'stable hot panel state object'
          require_literal "$app" 'ReaderHotPanelBackHandler(hotPanelState' 'isolated hot panel BackHandler'
          require_literal "$app" 'PersistentReaderPanelLayer(hotPanelState, ReaderPanel.QUICK_SETTINGS)' 'phase-owned quick panel visibility'
          require_literal "$app" 'PersistentReaderPanelLayer(hotPanelState, ReaderPanel.CHAPTERS)' 'phase-owned chapters panel visibility'
          require_literal "$app" '.semantics { if (panelState.value != target) invisibleToUser() }' 'phase-owned hidden panel semantics'
          forbid_literal "$app" 'PersistentReaderPanelLayer(panel ==' 'composition-owned panel visibility'
          '''
          if old in text:
              text = text.replace(old, new, 1)
          anchor = '''require_literal "$screen" 'snapshotFlow { controlsVisible }' 'layer-only controls visibility'
          '''
          status = '''require_literal "$screen" 'snapshotFlow { controlsVisible }' 'layer-only controls visibility'
          require_literal "$screen" 'val controlsVisibility = rememberSaveable(book.id)' 'stable controls visibility state object'
          require_literal "$screen" 'ReaderReadingStatusHost(' 'isolated reading status restart group'
          forbid_literal "$screen" 'if (settings.showReadingStatus) ReaderReadingStatusV3(' 'root reading-status page subscription'
          '''
          if "'isolated reading status restart group'" not in text and anchor in text:
              text = text.replace(anchor, status, 1)
          text = text.replace("'manual continuous settle' require_literal \"$screen\" 'AUTO_SCROLL_POSITION_SAMPLE_NS", "'manual continuous settle'\nrequire_literal \"$screen\" 'AUTO_SCROLL_POSITION_SAMPLE_NS")
          path.write_text(text)
          PY
          bash scripts/verify-reader-v3.sh
          python3 scripts/verify-reader-profile-contract.py
          git diff --check

      - name: Commit business cut and self-delete
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/reader-v3-frame-boundaries.yml scripts/apply-reader-v3-frame-boundaries.py
          git add \
            apps/android/app/src/main/java/com/junchen/jingdu/ReaderFastText.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/ReaderScreenV3.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/JingduApp.kt \
            docs/READER_V3_PROFILE_PROVENANCE.md \
            scripts/verify-reader-v3.sh
          git diff --cached --check
          git commit -m 'perf(android): close Reader V3 frame invalidation boundaries'
          git push origin HEAD:feat/reader-v3-prelaunch-final
