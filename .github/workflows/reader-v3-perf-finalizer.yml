name: Reader V3 performance finalizer

on:
  push:
    branches:
      - feat/reader-v3-prelaunch-final
    paths:
      - .github/workflows/reader-v3-perf-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: feat/reader-v3-prelaunch-final
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Apply real-input and bounded-raster stabilization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fixture = Path('apps/android/app/src/benchmark/java/com/junchen/jingdu/ReaderBenchmarkFixtureProvider.kt')
          text = fixture.read_text()
          old = '''                ReaderInteractionRuntime.continuousReady = false
                val preferences = ReaderPreferences(context)
'''
          new = '''                // Reset runtime-only readiness before every measured reader launch. A persisted
                // source position can legitimately be zero, so -1 is the unambiguous not-rendered sentinel.
                ReaderInteractionRuntime.foregroundPosition = -1L
                ReaderInteractionRuntime.backgroundTtsPlaying = false
                ReaderInteractionRuntime.continuousReady = false
                val preferences = ReaderPreferences(context)
'''
          if old not in text:
              raise SystemExit('fixture readiness reset target drifted')
          fixture.write_text(text.replace(old, new, 1))

          journey = Path('apps/android/macrobenchmark/src/main/java/com/junchen/jingdu/macrobenchmark/ReaderJourneyBenchmark.kt')
          text = journey.read_text()
          old = '''            openFixture(fixtureMiB)
            afterOpenPrepareBlock()
'''
          new = '''            openFixture(fixtureMiB)
            waitForReaderReady()
            afterOpenPrepareBlock()
'''
          if old not in text:
              raise SystemExit('interaction readiness target drifted')
          text = text.replace(old, new, 1)
          marker = '''    private fun MacrobenchmarkScope.waitForReaderAdvance(before: Long): Long {
'''
          ready = '''    private fun MacrobenchmarkScope.waitForReaderReady() {
        val deadline = System.nanoTime() + READER_READY_TIMEOUT_NS
        var position = -1L
        while (System.nanoTime() < deadline) {
            position = readerPosition()
            if (position >= 0L) {
                device.waitForIdle()
                // Compose hot controls/panels are intentionally retained and pre-recorded off the
                // interaction path. Give those post-render effects one bounded settle window.
                Thread.sleep(READER_POST_RENDER_SETTLE_MS)
                return
            }
            Thread.sleep(INPUT_POLL_MS)
        }
        error("Reader V3 did not publish an authoritative rendered position before interaction: $position")
    }

'''
          if marker not in text or 'private fun MacrobenchmarkScope.waitForReaderReady()' in text:
              raise SystemExit('reader-ready helper target drifted')
          text = text.replace(marker, ready + marker, 1)

          start = text.index('    private fun MacrobenchmarkScope.ensureTopControlsVisible() {')
          end = text.index('    private fun frameMetrics(): List<Metric>', start)
          controls = '''    private fun MacrobenchmarkScope.isOnScreen(node: androidx.test.uiautomator.UiObject2): Boolean {
        val bounds = node.visibleBounds
        return bounds.width() > 0 && bounds.height() > 0 &&
            bounds.right > 0 && bounds.bottom > 0 &&
            bounds.left < device.displayWidth && bounds.top < device.displayHeight
    }

    private fun MacrobenchmarkScope.visibleObject(selector: BySelector): androidx.test.uiautomator.UiObject2? =
        device.findObjects(selector).firstOrNull(::isOnScreen)

    private fun MacrobenchmarkScope.ensureTopControlsVisible() {
        if (visibleObject(By.text("Aa")) != null) return
        val taps = listOf(0.50f to 0.52f, 0.50f to 0.68f, 0.50f to 0.36f)
        repeat(2) {
            for ((x, y) in taps) {
                val px = (device.displayWidth * x).toInt()
                val py = (device.displayHeight * y).toInt()
                device.executeShellCommand("input tap $px $py")
                if (device.wait(Until.hasObject(By.text("Aa")), 1_100) && visibleObject(By.text("Aa")) != null) return
            }
        }
        error("Reader V3 top reading controls did not become visibly on-screen after real shell tap input")
    }

    private fun MacrobenchmarkScope.requireClick(selector: BySelector, label: String) {
        check(device.wait(Until.hasObject(selector), 3_000)) { "Reader V3 $label missing" }
        val target = visibleObject(selector) ?: error("Reader V3 $label exists only off-screen")
        target.click()
    }

    private fun MacrobenchmarkScope.requireChaptersClick() {
        visibleObject(By.desc("Chapters"))?.let { target -> target.click(); return }
        visibleObject(By.descContains("Chapter"))?.let { target -> target.click(); return }

        val aa = visibleObject(By.text("Aa")) ?: error("Reader V3 visible top reading controls missing")
        val anchor = aa.visibleBounds
        val candidate = device.findObjects(By.clickable(true))
            .asSequence()
            .filter(::isOnScreen)
            .filter { node ->
                val bounds = node.visibleBounds
                bounds.centerX() > anchor.centerX() &&
                    abs(bounds.centerY() - anchor.centerY()) <= maxOf(anchor.height(), bounds.height())
            }
            .minByOrNull { node -> node.visibleBounds.centerX() - anchor.centerX() }
            ?: error("Reader V3 visible chapters control missing beside Aa")
        candidate.click()
    }

'''
          text = text[:start] + controls + text[end:]
          old = '''        const val INPUT_POLL_MS = 25L
        const val CONTINUOUS_READY_POLL_MS = 50L
        const val INPUT_STATE_TIMEOUT_NS = 2_500_000_000L
        const val CONTINUOUS_READY_TIMEOUT_NS = 12_000_000_000L
'''
          new = '''        const val INPUT_POLL_MS = 25L
        const val CONTINUOUS_READY_POLL_MS = 50L
        const val READER_POST_RENDER_SETTLE_MS = 350L
        const val INPUT_STATE_TIMEOUT_NS = 2_500_000_000L
        const val READER_READY_TIMEOUT_NS = 12_000_000_000L
        const val CONTINUOUS_READY_TIMEOUT_NS = 12_000_000_000L
'''
          if old not in text:
              raise SystemExit('journey timeout constants target drifted')
          journey.write_text(text.replace(old, new, 1))

          fast = Path('apps/android/app/src/main/java/com/junchen/jingdu/ReaderFastText.kt')
          text = fast.read_text()
          old = '''                        (viewportHeightPx * 2).coerceAtLeast(1),
                        rasterBackgroundColor,
'''
          new = '''                        viewportHeightPx.coerceAtLeast(1),
                        rasterBackgroundColor,
'''
          if old not in text:
              raise SystemExit('continuous tile-height target drifted')
          text = text.replace(old, new, 1)
          old = '''            bitmap.setHasAlpha(false)
            bitmap.prepareToDraw()
            built += Tile(top, bitmap)
'''
          new = '''            bitmap.setHasAlpha(false)
            // Pre-upload only the opening viewport pair. Preparing the complete 4K-window tile set
            // evicts the very textures the next frames need on hosted SwiftShader; later tiles upload
            // lazily only when the real scroll reaches them.
            if (built.size < 2) bitmap.prepareToDraw()
            built += Tile(top, bitmap)
'''
          if old not in text:
              raise SystemExit('continuous prepareToDraw target drifted')
          fast.write_text(text.replace(old, new, 1))

          verify = Path('scripts/verify-reader-v3.sh')
          text = verify.read_text()
          anchor = '''require_literal "$fixture" 'ReaderInteractionRuntime.foregroundPosition' 'benchmark authoritative position source'
'''
          addition = '''require_literal "$fixture" 'ReaderInteractionRuntime.foregroundPosition = -1L' 'benchmark rendered-position readiness reset'
require_literal "$journey" 'waitForReaderReady()' 'interaction waits for rendered reader authority'
require_literal "$journey" 'isOnScreen' 'hot-control on-screen visibility guard'
require_literal "$fast_text" 'if (built.size < 2) bitmap.prepareToDraw()' 'bounded opening-tile GPU prewarm'
'''
          if anchor not in text:
              raise SystemExit('verify readiness anchor drifted')
          verify.write_text(text.replace(anchor, anchor + addition, 1))
          PY
          python3 scripts/test-android-performance-slo.py
          bash scripts/verify-reader-v3.sh
          python3 scripts/verify-reader-profile-contract.py
          git diff --check
          cd apps/android
          ./gradlew :app:compileBenchmarkKotlin :macrobenchmark:compileBenchmarkKotlin --no-daemon --warning-mode all
      - name: Commit finalization and self-delete
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/reader-v3-perf-finalizer.yml
          git add \
            apps/android/app/src/benchmark/java/com/junchen/jingdu/ReaderBenchmarkFixtureProvider.kt \
            apps/android/macrobenchmark/src/main/java/com/junchen/jingdu/macrobenchmark/ReaderJourneyBenchmark.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/ReaderFastText.kt \
            scripts/verify-reader-v3.sh
          git diff --cached --check
          git commit -m 'perf(android): bound Reader V3 interaction prewarm'
          git push origin HEAD:feat/reader-v3-prelaunch-final
