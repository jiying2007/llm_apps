name: Reader chapter row draw P99 fix

on:
  push:
    branches:
      - fix/reader-chapter-first-show-p99
    paths:
      - .github/workflows/reader-chapter-row-p99-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/reader-chapter-first-show-p99
          fetch-depth: 0
      - name: Remove redundant unselected chapter row drawing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          panel = Path('apps/android/app/src/main/java/com/junchen/jingdu/ReaderSmartChaptersPanel.kt')
          text = panel.read_text()
          old = '\n'.join([
              '                        Row(',
              '                            Modifier.fillMaxWidth()',
              '                                .background(',
              '                                    if (selected) MaterialTheme.colorScheme.primaryContainer.copy(alpha = 0.65f)',
              '                                    else MaterialTheme.colorScheme.surface,',
              '                                    RoundedCornerShape(14.dp),',
              '                                )',
              '                                .clickable { actions.onJump(chapter.offset) }',
          ])
          new = '\n'.join([
              '                        val rowModifier = if (selected) {',
              '                            Modifier.fillMaxWidth().background(',
              '                                MaterialTheme.colorScheme.primaryContainer.copy(alpha = 0.65f),',
              '                                RoundedCornerShape(14.dp),',
              '                            )',
              '                        } else {',
              '                            Modifier.fillMaxWidth()',
              '                        }',
              '                        Row(',
              '                            rowModifier',
              '                                .clickable { actions.onJump(chapter.offset) }',
          ])
          assert text.count(old) == 1, 'chapter row background anchor mismatch'
          panel.write_text(text.replace(old, new))

          contract = Path('scripts/verify-reader.sh')
          text = contract.read_text()
          anchor = 'require_literal "$smart_panel" \'val displayTitle = ReaderTextPresentation.chapterTitle(chapter.title, state.settings)\' \'viewport-only chapter title presentation\'\n'
          addition = anchor + 'forbid_literal "$smart_panel" \'else MaterialTheme.colorScheme.surface,\' \'redundant unselected chapter row surface draw\'\n'
          assert text.count(anchor) == 1, 'chapter row draw contract anchor mismatch'
          contract.write_text(text.replace(anchor, addition))
          PY
          git diff --check
          bash scripts/verify-reader.sh
          python3 scripts/verify-reader-profile-contract.py
          python3 scripts/test-android-performance-slo.py
      - name: Commit fix and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reader-chapter-row-p99-fix.yml
          git add apps/android/app/src/main/java/com/junchen/jingdu/ReaderSmartChaptersPanel.kt scripts/verify-reader.sh
          git commit -m 'perf: skip redundant chapter row surface draws'
          git push origin HEAD:fix/reader-chapter-first-show-p99
