name: Reading Experience Contract Bootstrap

on:
  push:
    branches: [feat/reading-experience-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/reading-experience-v1
      - name: Wire terminal reading contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-terminal-quality.sh')
          text = p.read_text(encoding='utf-8')
          marker = 'bash ./scripts/verify-reading-experience.sh'
          if marker not in text:
              if not text.endswith('\n'):
                  text += '\n'
              text += '\n# Reading surface remains a first-class terminal product gate.\n' + marker + '\n'
              p.write_text(text, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify-terminal-quality.sh
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(reader): wire terminal reading experience gate'
          git push origin HEAD:feat/reading-experience-v1
