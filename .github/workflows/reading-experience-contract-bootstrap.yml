name: Reading Experience Final Bootstrap

on:
  push:
    branches: [feat/reading-experience-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/reading-experience-v1
      - name: Settle reader compile contract and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          reader = Path('apps/android/app/src/main/java/com/junchen/jingdu/ReaderScreen.kt')
          text = reader.read_text(encoding='utf-8')
          collect_import = 'import kotlinx.coroutines.flow.collect\n'
          if collect_import not in text:
              marker = 'import kotlinx.coroutines.flow.distinctUntilChanged\n'
              if marker not in text:
                  raise SystemExit('distinctUntilChanged import marker missing')
              text = text.replace(marker, collect_import + marker, 1)

          duplicate = 'private fun stripTxt(name: String): String = if (name.lowercase().endsWith(".txt")) name.dropLast(4) else name\n\n'
          if duplicate in text:
              text = text.replace(duplicate, '', 1)
          reader.write_text(text, encoding='utf-8')

          terminal = Path('scripts/verify-terminal-quality.sh')
          terminal_text = terminal.read_text(encoding='utf-8')
          gate = 'bash ./scripts/verify-reading-experience.sh'
          if gate not in terminal_text:
              if not terminal_text.endswith('\n'):
                  terminal_text += '\n'
              terminal_text += '\n# Reading surface remains a first-class terminal product gate.\n' + gate + '\n'
              terminal.write_text(terminal_text, encoding='utf-8')
          PY

          git rm .github/workflows/reading-experience-contract-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/android/app/src/main/java/com/junchen/jingdu/ReaderScreen.kt scripts/verify-terminal-quality.sh
          git commit -m 'fix(reader): settle compile and terminal experience gate'
          git push origin HEAD:feat/reading-experience-v1
