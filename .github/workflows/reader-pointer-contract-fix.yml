name: Reader pointer contract migrate

on:
  push:
    branches: [ux/reader-comprehensive]
    paths: [.github/workflows/reader-pointer-contract-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ux/reader-comprehensive
          fetch-depth: 0
      - name: Strengthen pointer ownership contract and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-reader.sh')
          text = path.read_text()
          old = "require_literal \"$screen\" 'if (maxPointers > 1) return@awaitEachGesture' 'selection-safe pointer arbitration'"
          new = "\n".join([
              "require_literal \"$screen\" 'if (maxPointers > 1) {' 'single-owner multi-touch arbitration'",
              "require_literal \"$screen\" 'if (settings.pinchFontEnabled)' 'pinch stays inside reader gesture owner'",
              "require_literal \"$screen\" 'onResizeFont(zoom)' 'single-owner pinch font resize'",
              "forbid_literal \"$screen\" 'detectTransformGestures' 'competing transform gesture detector'",
          ])
          if text.count(old) != 1:
              raise SystemExit('old pointer contract not found exactly once')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/reader-pointer-contract-fix.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ci: enforce single-owner reader gestures'
          git push origin HEAD:ux/reader-comprehensive
