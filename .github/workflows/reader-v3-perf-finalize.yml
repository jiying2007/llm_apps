name: Reader V3 perf finalizer

on:
  push:
    branches:
      - feat/reader-v3-prelaunch-final
    paths:
      - .github/workflows/reader-v3-perf-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/reader-v3-prelaunch-final

      - name: Apply targeted Reader V3 performance fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def require_replace(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'{label} drifted')
              return text.replace(old, new, 1)

          fast_path = Path('apps/android/app/src/main/java/com/junchen/jingdu/ReaderFastText.kt')
          fast = fast_path.read_text()
          start = fast.index('        layout?.let { ready ->\n            Layout(')
          end = fast.index('\n    }\n}\n\nprivate fun buildFastStaticLayout', start)
          new_draw = '\n'.join([
              '        layout?.let { ready ->',
              '            // Keep the state-phase scroll model, but draw into one viewport-sized Canvas.',
              '            // The previous full-text-height layer could be tens of thousands of pixels',
              '            // tall; hosted HWUI repeatedly recording/uploading it regressed P95/P99.',
              '            // Reading scrollOffsetPx in draw invalidates draw only, not composition/layout.',
              '            Canvas(Modifier.fillMaxSize()) {',
              '                val maxOffset = (ready.size.height - viewportHeightPx).coerceAtLeast(0).toFloat()',
              '                val canvas = drawContext.canvas',
              '                canvas.save()',
              '                canvas.translate(0f, -scrollOffsetPx().coerceIn(0f, maxOffset))',
              '                drawText(ready)',
              '                canvas.restore()',
              '            }',
              '        }',
          ])
          fast = fast[:start] + new_draw + fast[end:]
          for line in (
              'import androidx.compose.foundation.layout.height\n',
              'import androidx.compose.ui.graphics.graphicsLayer\n',
              'import androidx.compose.ui.layout.Layout\n',
          ):
              fast = fast.replace(line, '')
          fast_path.write_text(fast)

          chapters_path = Path('apps/android/app/src/main/java/com/junchen/jingdu/ReaderSmartChaptersPanel.kt')
          chapters = chapters_path.read_text()
          chapters = require_replace(
              chapters,
              'package com.junchen.jingdu\n\n',
              'package com.junchen.jingdu\n\nimport android.content.Context\n',
              'ReaderSmartChaptersPanel import',
          )
          cache_old = (
              '    @Synchronized fun get(key: TocPanelKey): TocPanelEntry? = entries[key]\n'
              '    @Synchronized fun put(key: TocPanelKey, entry: TocPanelEntry) { entries[key] = entry }\n'
              '}\n'
          )
          cache_new = (
              '    @Synchronized fun get(key: TocPanelKey): TocPanelEntry? = entries[key]\n'
              '    @Synchronized fun get(bookId: String, revision: String, length: Long): TocPanelEntry? =\n'
              '        entries.entries.firstOrNull { (key, _) ->\n'
              '            key.bookId == bookId && key.revision == revision && key.length == length\n'
              '        }?.value\n'
              '    @Synchronized fun put(key: TocPanelKey, entry: TocPanelEntry) { entries[key] = entry }\n'
              '}\n\n'
              '/**\n'
              ' * Promote the already-import-prewarmed Smart TOC disk cache into the tiny in-process\n'
              ' * panel cache while Reader is opening on a worker. First Chapters tap is therefore\n'
              ' * one presentation phase and never hydrates global reader chapter state.\n'
              ' */\n'
              'internal fun prewarmReaderSmartChaptersPanel(\n'
              '    context: Context,\n'
              '    bookId: String,\n'
              '    revision: String,\n'
              '    length: Long,\n'
              ') {\n'
              '    if (bookId.isBlank() || revision.isBlank() || length <= 0L) return\n'
              '    if (TocPanelCache.get(bookId, revision, length) != null) return\n'
              '    val appContext = context.applicationContext\n'
              '    val base = SmartTocCacheStore(appContext).load(bookId, revision, length) ?: return\n'
              '    val key = TocPanelKey(bookId, revision, length, base.chapters.hashCode())\n'
              '    if (TocPanelCache.get(key) != null) return\n'
              '    val store = TocOverrideStore(appContext)\n'
              '    val computed = store.apply(base, store.load(bookId, length))\n'
              '    TocPanelCache.put(key, TocPanelEntry(base, computed))\n'
              '}\n'
          )
          chapters = require_replace(chapters, cache_old, cache_new, 'TocPanelCache')

          state_old = (
              '    val store = remember { TocOverrideStore(context) }\n'
              '    val derivedCache = remember { SmartTocCacheStore(context) }\n'
              '    var base by remember(book?.id) { mutableStateOf<TocQualityReport?>(null) }\n'
              '    var report by remember(book?.id) { mutableStateOf<TocQualityReport?>(null) }\n'
              '    var loading by remember(book?.id) { mutableStateOf(!state.chaptersLoaded) }\n'
          )
          state_new = (
              '    val store = remember { TocOverrideStore(context) }\n'
              '    val derivedCache = remember { SmartTocCacheStore(context) }\n'
              '    val initial = remember(book?.id, book?.normalizedSha256, state.length) {\n'
              '        book?.let { TocPanelCache.get(it.id, it.normalizedSha256, state.length) }\n'
              '    }\n'
              '    var base by remember(book?.id, book?.normalizedSha256, state.length) { mutableStateOf(initial?.base) }\n'
              '    var report by remember(book?.id, book?.normalizedSha256, state.length) { mutableStateOf(initial?.report) }\n'
              '    var loading by remember(book?.id, book?.normalizedSha256, state.length) { mutableStateOf(initial == null && !state.chaptersLoaded) }\n'
          )
          chapters = require_replace(chapters, state_old, state_new, 'ReaderSmartChaptersPanel state')
          effect_old = (
              '        if (book == null) { base = null; report = null; loading = false; windowStart = 0; return@LaunchedEffect }\n\n'
              '        // Import/re-decode prewarms this revision cache. Paint it first so opening Chapters does not\n'
          )
          effect_new = (
              '        if (book == null) { base = null; report = null; loading = false; windowStart = 0; return@LaunchedEffect }\n'
              '        if (initial != null) return@LaunchedEffect\n\n'
              '        // Import/re-decode prewarms this revision cache. Paint it first so opening Chapters does not\n'
          )
          chapters = require_replace(chapters, effect_old, effect_new, 'ReaderSmartChaptersPanel effect')
          chapters_path.write_text(chapters)

          activity_path = Path('apps/android/app/src/main/java/com/junchen/jingdu/MainActivity.kt')
          activity = activity_path.read_text()
          open_old = (
              '                candidate.open(file, restored)\n'
              '                if (token != workGeneration.get() || isDestroyed) { candidate.close(); return@execute }\n'
              '                main.post {\n'
          )
          open_new = (
              '                candidate.open(file, restored)\n'
              '                if (!clean) {\n'
              '                    runCatching {\n'
              '                        prewarmReaderSmartChaptersPanel(\n'
              '                            applicationContext,\n'
              '                            book.id,\n'
              '                            book.normalizedSha256,\n'
              '                            candidate.length(),\n'
              '                        )\n'
              '                    }\n'
              '                }\n'
              '                if (token != workGeneration.get() || isDestroyed) { candidate.close(); return@execute }\n'
              '                main.post {\n'
          )
          activity = require_replace(activity, open_old, open_new, 'MainActivity openBook')
          activity_path.write_text(activity)
          PY

      - name: Commit finalizer result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reader-v3-perf-finalize.yml
          git add \
            apps/android/app/src/main/java/com/junchen/jingdu/ReaderFastText.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/ReaderSmartChaptersPanel.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/MainActivity.kt
          git diff --cached --check
          git commit -m 'perf(android): collapse final reader hot paths'
          git push origin HEAD:feat/reader-v3-prelaunch-final
