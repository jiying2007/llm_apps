name: Reader V3 Profile Selection Finalizer

on:
  push:
    branches: [feat/reader-v3-prelaunch-final]
    paths: [.github/workflows/reader-v3-profile-selection-finalizer.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/reader-v3-prelaunch-final
          fetch-depth: 0
      - name: Apply lazy selection and refreshed curated profile
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          screen_path = Path("apps/android/app/src/main/java/com/junchen/jingdu/ReaderScreenV3.kt")
          screen = screen_path.read_text()
          screen = once(
              screen,
              '''    val annotated = remember(sourceStart, visibleText, state.annotations, state.tts, settings.emphasizeHeadings, spec.fingerprint) {\n        ReaderSelectionController.annotatedForSelection(sourceStart, readerAnnotatedTextV3(sourceStart, visibleText, map, state), map)\n    }\n''',
              '''    val visual = remember(sourceStart, visibleText, state.annotations, state.tts, settings.emphasizeHeadings, spec.fingerprint) {\n        readerAnnotatedTextV3(sourceStart, visibleText, map, state)\n    }\n    // Two-column selection needs one shared source-annotated sequence so the second column retains\n    // its exact display offset. Compact/single-column reading stays visual-only until selection mode.\n    val annotated = remember(sourceStart, visual, map, columns) {\n        if (columns == 2) ReaderSelectionController.annotatedForSelection(sourceStart, visual, map) else visual\n    }\n''',
              "paged lazy selection annotations",
          )
          screen = once(
              screen,
              '''                Text(annotated, Modifier.fillMaxHeight().widthIn(max = 760.dp).padding(horizontal = settings.horizontalPaddingDp.dp, vertical = settings.verticalPaddingDp.dp), style = style, overflow = TextOverflow.Clip)\n''',
              '''                Text(\n                    visual,\n                    Modifier.fillMaxHeight().widthIn(max = 760.dp).padding(horizontal = settings.horizontalPaddingDp.dp, vertical = settings.verticalPaddingDp.dp),\n                    style = style,\n                    overflow = TextOverflow.Clip,\n                    sourceBase = sourceStart,\n                    sourceMap = map,\n                )\n''',
              "paged single-column lazy selection input",
          )
          screen = once(
              screen,
              '''    val annotated = remember(start, display, state.annotations, state.tts, settings.emphasizeHeadings, spec.fingerprint) {\n        ReaderSelectionController.annotatedForSelection(start, readerAnnotatedTextV3(start, display, map, state), map)\n    }\n''',
              '''    val visual = remember(start, display, state.annotations, state.tts, settings.emphasizeHeadings, spec.fingerprint) {\n        readerAnnotatedTextV3(start, display, map, state)\n    }\n''',
              "continuous lazy selection annotations",
          )
          screen = once(
              screen,
              '''            Text(annotated, Modifier.fillMaxWidth().verticalScroll(scrollState).padding(horizontal = settings.horizontalPaddingDp.dp, vertical = settings.verticalPaddingDp.dp).widthIn(max = 760.dp), style = style, overflow = TextOverflow.Clip, onTextLayout = { layoutResult = it })\n''',
              '''            Text(\n                visual,\n                Modifier.fillMaxWidth().verticalScroll(scrollState).padding(horizontal = settings.horizontalPaddingDp.dp, vertical = settings.verticalPaddingDp.dp).widthIn(max = 760.dp),\n                style = style,\n                overflow = TextOverflow.Clip,\n                sourceBase = start,\n                sourceMap = map,\n                onTextLayout = { layoutResult = it },\n            )\n''',
              "continuous lazy selection input",
          )
          screen_path.write_text(screen)

          fast_path = Path("apps/android/app/src/main/java/com/junchen/jingdu/ReaderFastText.kt")
          fast = fast_path.read_text()
          fast = once(
              fast,
              '''internal fun Text(text: AnnotatedString, modifier: Modifier, style: TextStyle, overflow: TextOverflow) {\n''',
              '''internal fun Text(\n    text: AnnotatedString,\n    modifier: Modifier,\n    style: TextStyle,\n    overflow: TextOverflow,\n    sourceBase: Long = 0L,\n    sourceMap: SourceDisplayMap? = null,\n) {\n''',
              "paged fast text source mapping signature",
          )
          fast = once(
              fast,
              '''    if (selectionMode || accessibility.isTouchExplorationEnabled) {\n        androidx.compose.material3.Text(text = text, modifier = modifier, style = style, overflow = overflow)\n        return\n    }\n''',
              '''    if (selectionMode || accessibility.isTouchExplorationEnabled) {\n        val selectable = remember(text, sourceBase, sourceMap) {\n            sourceMap?.let { ReaderSelectionController.annotatedForSelection(sourceBase, text, it) } ?: text\n        }\n        androidx.compose.material3.Text(text = selectable, modifier = modifier, style = style, overflow = overflow)\n        return\n    }\n''',
              "paged lazy selectable text",
          )
          fast = once(
              fast,
              '''internal fun Text(text: AnnotatedString, modifier: Modifier, style: TextStyle, overflow: TextOverflow, onTextLayout: (TextLayoutResult) -> Unit) {\n''',
              '''internal fun Text(\n    text: AnnotatedString,\n    modifier: Modifier,\n    style: TextStyle,\n    overflow: TextOverflow,\n    sourceBase: Long = 0L,\n    sourceMap: SourceDisplayMap? = null,\n    onTextLayout: (TextLayoutResult) -> Unit,\n) {\n''',
              "continuous fast text source mapping signature",
          )
          fast = once(
              fast,
              '''    if (selectionMode || accessibility.isTouchExplorationEnabled) {\n        androidx.compose.material3.Text(text = text, modifier = modifier, style = style, overflow = overflow, onTextLayout = onTextLayout)\n        return\n    }\n''',
              '''    if (selectionMode || accessibility.isTouchExplorationEnabled) {\n        val selectable = remember(text, sourceBase, sourceMap) {\n            sourceMap?.let { ReaderSelectionController.annotatedForSelection(sourceBase, text, it) } ?: text\n        }\n        androidx.compose.material3.Text(text = selectable, modifier = modifier, style = style, overflow = overflow, onTextLayout = onTextLayout)\n        return\n    }\n''',
              "continuous lazy selectable text",
          )
          fast_path.write_text(fast)

          Path("apps/android/app/src/main/baseline-prof.txt").write_text('''HPLcom/junchen/jingdu/MainActivity;->**(**)**\nHPLcom/junchen/jingdu/JingduAppKt;->**(**)**\nHPLcom/junchen/jingdu/LibraryScreenKt;->**(**)**\nHPLcom/junchen/jingdu/ReaderScreenV3Kt;->**(**)**\nHPLcom/junchen/jingdu/ReaderFastTextKt;->**(**)**\nHPLcom/junchen/jingdu/ReaderHotControlsKt;->**(**)**\nHPLcom/junchen/jingdu/ReaderHotPanelCanvasKt;->**(**)**\nHPLcom/junchen/jingdu/ReaderQuickPanelsKt;->**(**)**\nHPLcom/junchen/jingdu/ReaderSmartChaptersPanelKt;->**(**)**\nHPLcom/junchen/jingdu/ReaderPanelSurfaceKt;->**(**)**\nHPLcom/junchen/jingdu/ReaderPresentationPipeline;->**(**)**\nHPLcom/junchen/jingdu/ReaderPageLayoutCache;->**(**)**\nHPLcom/junchen/jingdu/ReaderViewportEngine;->**(**)**\nHPLcom/junchen/jingdu/ReaderTypographySpec;->**(**)**\nHPLcom/junchen/jingdu/TextProjection;->**(**)**\nHPLcom/junchen/jingdu/ReaderSelectionController;->**(**)**\nHPLcom/junchen/jingdu/ReaderController;->**(**)**\nHPLcom/junchen/jingdu/ReaderViewModel;->**(**)**\nHPLcom/junchen/jingdu/ReaderStatsStore;->**(**)**\nHPLcom/junchen/jingdu/ReaderPreferences;->**(**)**\nHPLcom/junchen/jingdu/ReaderPreferencesKt;->**(**)**\nHPLcom/junchen/jingdu/ReaderSettings;->**(**)**\nHPLcom/junchen/jingdu/AppUiState;->**(**)**\nHPLcom/junchen/jingdu/BookRepository;->**(**)**\nHPLcom/junchen/jingdu/SmartToc;->**(**)**\nHPLcom/junchen/jingdu/TocPanelCache;->**(**)**\nHPLandroidx/compose/runtime/**->**(**)**\nHPLandroidx/compose/ui/text/**->**(**)**\nHPLandroidx/compose/ui/node/**->**(**)**\nHPLandroidx/compose/ui/layout/**->**(**)**\nHPLandroidx/compose/ui/graphics/**->**(**)**\nHPLandroidx/compose/ui/platform/**->**(**)**\nHPLandroidx/compose/ui/input/**->**(**)**\nHPLandroidx/compose/ui/semantics/**->**(**)**\nHPLandroidx/compose/foundation/text/**->**(**)**\nHPLandroidx/compose/foundation/lazy/**->**(**)**\nHPLandroidx/compose/foundation/layout/**->**(**)**\nHPLandroidx/compose/foundation/gestures/**->**(**)**\nHPLandroidx/compose/animation/**->**(**)**\nHPLandroidx/compose/material3/TextKt;->**(**)**\nHPLandroidx/compose/material3/SurfaceKt;->**(**)**\nHPLandroidx/compose/material3/IconButtonKt;->**(**)**\nHPLandroidx/compose/material3/IconKt;->**(**)**\nHPLandroidx/compose/material3/ButtonKt;->**(**)**\nHPLandroidx/compose/material3/ProgressIndicatorKt;->**(**)**\n''')

          Path("apps/android/app/src/main/startup-prof.txt").write_text('''HSPLcom/junchen/jingdu/MainActivity;->**(**)**\nHSPLcom/junchen/jingdu/JingduAppKt;->**(**)**\nHSPLcom/junchen/jingdu/LibraryScreenKt;->**(**)**\nHSPLcom/junchen/jingdu/ReaderRouteKt;->**(**)**\nHSPLcom/junchen/jingdu/ReaderScreenV3Kt;->**(**)**\nHSPLcom/junchen/jingdu/ReaderPreferences;->**(**)**\nHSPLcom/junchen/jingdu/ReaderPreferencesKt;->**(**)**\nHSPLcom/junchen/jingdu/ReaderViewModel;->**(**)**\nHSPLcom/junchen/jingdu/BookRepository;->**(**)**\nHSPLcom/junchen/jingdu/AppUiState;->**(**)**\n''')

          Path("docs/READER_V3_PROFILE_PROVENANCE.md").write_text('''# Reader V3 profile provenance\n\nThe product Baseline/Startup Profile assets are trace-derived, curated HRF rules. They intentionally stay compact instead of committing raw device-wide capture noise from Compose/framework dependencies.\n\nAuthoritative generation evidence for this revision family:\n\n- source head: `d2917b523088621b0a5c76671bbaba50d87a797a`\n- GitHub Actions CI: `#671` / run `33164386045`\n- generated baseline source: 24,155 rules, 2,511,097 bytes, SHA-256 `b770d56668ee9a18dcac948cf5c44428b5cc06317e6fd1b50ce1b55bf973d61d`\n- generated startup source: 22,717 rules, 2,339,097 bytes, SHA-256 `43c1fa521bc19b648c0b8956060095e8273180728763d16cf4e3b73784a94204`\n\nThe committed `src/main/baseline-prof.txt` keeps app-owned Reader V3 hot classes and the Compose runtime, platform, graphics, text, node, layout, gesture and animation families that dominate the #671 critical-journey trace. Material coverage is limited to the controls still present in the measured reader path instead of wildcarding the entire UI toolkit. `src/main/startup-prof.txt` stays deliberately narrower and contains only the launcher/library/reader startup funnel. Runtime panel/scroll packages are not wildcarded into Startup Profile.\n\nPerformance gating is independent: `ReaderJourneyBenchmark` uses `CompilationMode.Partial(BaselineProfileMode.Require, warmupIterations = 0)` against the production R8 APK, modelling a fresh Play-style install using the profile already packaged in that APK. The 40/80 ms CPU-frame SLO runs first; profile collection runs afterwards on a separate non-minified target, so newly generated rules can never self-feed the same SLO run.\n\nRaw generated profile files are CI evidence, not source-of-truth product assets. Regenerate them after material CUJ/hot-path changes and update this provenance together with the curated rules.\n''')

          v3_path = Path("scripts/verify-reader-v3.sh")
          v3 = v3_path.read_text()
          v3 = once(
              v3,
              'hot_controls=apps/android/app/src/main/java/com/junchen/jingdu/ReaderHotControls.kt\n',
              'hot_controls=apps/android/app/src/main/java/com/junchen/jingdu/ReaderHotControls.kt\nfast_text=apps/android/app/src/main/java/com/junchen/jingdu/ReaderFastText.kt\n',
              "fast text contract path",
          )
          v3 = once(
              v3,
              "require_literal \"$screen\" 'readerAnnotatedTextV3(sourceStart, visibleText' 'annotation after pagination'\n",
              """require_literal \"$screen\" 'readerAnnotatedTextV3(sourceStart, visibleText' 'annotation after pagination'\nrequire_literal \"$screen\" 'if (columns == 2) ReaderSelectionController.annotatedForSelection' 'two-column exact selection fallback'\nrequire_literal \"$screen\" 'sourceBase = sourceStart' 'paged lazy selection source base'\nrequire_literal \"$screen\" 'sourceBase = start' 'continuous lazy selection source base'\nrequire_literal \"$fast_text\" 'sourceMap?.let { ReaderSelectionController.annotatedForSelection(sourceBase, text, it) } ?: text' 'selection annotations materialize only in selectable mode'\n""",
              "lazy selection contract",
          )
          v3_path.write_text(v3)

          profile_path = Path("scripts/verify-reader-profile-contract.py")
          profile = profile_path.read_text()
          profile = once(
              profile,
              '''    "Landroidx/compose/ui/layout/**",\n):\n''',
              '''    "Landroidx/compose/ui/layout/**",\n    "Landroidx/compose/runtime/**",\n    "Landroidx/compose/ui/platform/**",\n    "Landroidx/compose/ui/graphics/**",\n    "Landroidx/compose/foundation/gestures/**",\n    "Lcom/junchen/jingdu/ReaderFastTextKt;",\n    "Lcom/junchen/jingdu/ReaderHotControlsKt;",\n):\n''',
              "refreshed baseline contract markers",
          )
          profile = once(
              profile,
              '''assert len(profile_evidence) == 2, "baseline/startup profile provenance evidence must include rules, bytes and SHA-256"\n''',
              '''assert len(profile_evidence) == 2, "baseline/startup profile provenance evidence must include rules, bytes and SHA-256"\nassert "d2917b523088621b0a5c76671bbaba50d87a797a" in provenance, "current Reader V3 profile source head missing"\nassert "run `33164386045`" in provenance, "current Reader V3 profile run missing"\nassert "BaselineProfileMode.Require" in provenance and "warmupIterations = 0" in provenance, "profile provenance must describe the production install-state gate"\n''',
              "current profile provenance contract",
          )
          profile_path.write_text(profile)
          PY

          bash scripts/verify-reader-v3.sh
          python3 scripts/verify-reader-profile-contract.py
          git diff --check
      - name: Commit final state and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reader-v3-profile-selection-finalizer.yml
          git add apps/android/app/src/main/java/com/junchen/jingdu/ReaderScreenV3.kt \
                  apps/android/app/src/main/java/com/junchen/jingdu/ReaderFastText.kt \
                  apps/android/app/src/main/baseline-prof.txt \
                  apps/android/app/src/main/startup-prof.txt \
                  docs/READER_V3_PROFILE_PROVENANCE.md \
                  scripts/verify-reader-v3.sh \
                  scripts/verify-reader-profile-contract.py
          git commit -m "perf(android): materialize selection metadata on demand"
          git push origin HEAD:feat/reader-v3-prelaunch-final
