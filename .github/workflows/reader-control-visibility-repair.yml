name: Reader control visibility repair

on:
  push:
    branches:
      - "ux/reader-comprehensive"
    paths:
      - ".github/workflows/reader-control-visibility-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ux/reader-comprehensive
          fetch-depth: 0
      - name: Make Reader chrome visibility composition-observable
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/android/app/src/main/java/com/junchen/jingdu/ReaderScreen.kt')
          text = path.read_text(encoding='utf-8')

          old_call = '.readerControlLayer(controlsVisibility,'
          count = text.count(old_call)
          assert count == 3, f'expected 3 Reader chrome layer calls, found {count}'
          text = text.replace(old_call, '.readerControlLayer(controlsVisible,')

          old = '''private fun Modifier.readerControlLayer(
              visibility: State<Boolean>,
              hiddenOffsetPx: Int,
          ): Modifier = this
              .layout { measurable, constraints ->
                  val placeable = measurable.measure(constraints)
                  layout(placeable.width, placeable.height) {
                      val visible = visibility.value
                      placeable.placeWithLayer(
                          x = 0,
                          y = if (visible) 0 else hiddenOffsetPx,
                      ) { alpha = if (visible) 1f else 0f }
                  }
              }
              .semantics { if (!visibility.value) hideFromAccessibility() }
          '''
          new = '''private fun Modifier.readerControlLayer(
              visible: Boolean,
              hiddenOffsetPx: Int,
          ): Modifier {
              val placement = layout { measurable, constraints ->
                  val placeable = measurable.measure(constraints)
                  layout(placeable.width, placeable.height) {
                      placeable.placeWithLayer(
                          x = 0,
                          y = if (visible) 0 else hiddenOffsetPx,
                      ) { alpha = if (visible) 1f else 0f }
                  }
              }
              return if (visible) {
                  this.then(placement)
              } else {
                  this.then(placement).semantics { hideFromAccessibility() }
              }
          }
          '''
          assert old in text, 'readerControlLayer implementation did not match expected head'
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify focused repair
        run: |
          git diff --check
          grep -Fq '.readerControlLayer(controlsVisible, -READER_HIDDEN_LAYER_OFFSET_PX)' apps/android/app/src/main/java/com/junchen/jingdu/ReaderScreen.kt
          grep -Fq '.readerControlLayer(controlsVisible, READER_HIDDEN_LAYER_OFFSET_PX)' apps/android/app/src/main/java/com/junchen/jingdu/ReaderScreen.kt
          ! grep -Fq '.readerControlLayer(controlsVisibility,' apps/android/app/src/main/java/com/junchen/jingdu/ReaderScreen.kt
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reader-control-visibility-repair.yml
          git add apps/android/app/src/main/java/com/junchen/jingdu/ReaderScreen.kt
          git commit -m 'fix: make reader chrome visibility observable'
          git push origin HEAD:ux/reader-comprehensive
