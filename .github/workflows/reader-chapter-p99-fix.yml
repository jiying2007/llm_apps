name: Reader chapter P99 fix

on:
  push:
    branches: [ux/reader-comprehensive]
    paths: [.github/workflows/reader-chapter-p99-fix.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ux/reader-comprehensive
          fetch-depth: 0
      - name: Remove eager chapter work and align profile selectors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          panel = Path('apps/android/app/src/main/java/com/junchen/jingdu/ReaderSmartChaptersPanel.kt')
          text = panel.read_text()
          old = "    val chapters = report?.chapters.orEmpty()\n    val displayTitles = remember(chapters, state.settings.chineseMode, state.settings.chineseOverrides) {\n        chapters.map { ReaderTextPresentation.chapterTitle(it.title, state.settings) }\n    }\n    val activePosition = currentPosition()\n    val currentIndex = chapters.indexOfLast { it.offset <= activePosition }.coerceAtLeast(0)\n"
          new = "    val chapters = report?.chapters.orEmpty()\n    val activePosition = currentPosition()\n    val currentIndex = remember(chapters, activePosition) {\n        if (chapters.isEmpty()) {\n            0\n        } else {\n            var low = 0\n            var high = chapters.lastIndex\n            var result = 0\n            while (low <= high) {\n                val mid = (low + high) ushr 1\n                if (chapters[mid].offset <= activePosition) {\n                    result = mid\n                    low = mid + 1\n                } else {\n                    high = mid - 1\n                }\n            }\n            result\n        }\n    }\n"
          assert text.count(old) == 1, 'chapter eager-title/current-index anchor mismatch'
          text = text.replace(old, new)
          old = "                    itemsIndexed(chapters, key = { _, item -> item.offset }) { index, chapter ->\n                        val selected = index == currentIndex\n                        val percent = if (state.length <= 0L) 0 else {\n"
          new = "                    itemsIndexed(chapters, key = { _, item -> item.offset }) { index, chapter ->\n                        val displayTitle = ReaderTextPresentation.chapterTitle(chapter.title, state.settings)\n                        val selected = index == currentIndex\n                        val percent = if (state.length <= 0L) 0 else {\n"
          assert text.count(old) == 1, 'chapter row anchor mismatch'
          text = text.replace(old, new)
          assert text.count('displayTitles[index]') == 2, 'chapter eager title references mismatch'
          panel.write_text(text.replace('displayTitles[index]', 'displayTitle'))
          profile = Path('apps/android/macrobenchmark/src/main/java/com/junchen/jingdu/macrobenchmark/BaselineProfileGenerator.kt')
          text = profile.read_text()
          assert text.count('            requireClick(By.text("Aa"), "quick reading settings control")') == 1
          text = text.replace('            requireClick(By.text("Aa"), "quick reading settings control")', '            requireReadingSettingsClick()')
          old = "    private fun MacrobenchmarkScope.ensureTopControlsVisible() {\n        if (visibleBounds(By.text(\"Aa\")) != null) return\n        val taps = listOf(0.50f to 0.52f, 0.50f to 0.68f, 0.50f to 0.36f)\n        repeat(2) {\n            for ((x, y) in taps) {\n                check(device.click((device.displayWidth * x).toInt(), (device.displayHeight * y).toInt())) {\n                    \"Reader baseline top-control tap was not injected\"\n                }\n                if (device.wait(Until.hasObject(By.text(\"Aa\")), 900) && visibleBounds(By.text(\"Aa\")) != null) return\n            }\n        }\n        error(\"Reader baseline top reading controls did not become visibly on-screen\")\n    }\n\n"
          new = "    private fun MacrobenchmarkScope.readingSettingsBounds(): android.graphics.Rect? =\n        visibleBounds(By.desc(\"Reading settings\")) ?: visibleBounds(By.text(\"Aa\"))\n\n    private fun MacrobenchmarkScope.ensureTopControlsVisible() {\n        if (readingSettingsBounds() != null) return\n        val taps = listOf(0.50f to 0.52f, 0.50f to 0.68f, 0.50f to 0.36f)\n        repeat(2) {\n            for ((x, y) in taps) {\n                check(device.click((device.displayWidth * x).toInt(), (device.displayHeight * y).toInt())) {\n                    \"Reader baseline top-control tap was not injected\"\n                }\n                if (device.wait(Until.hasObject(By.desc(\"Reading settings\")), 900) && readingSettingsBounds() != null) return\n            }\n        }\n        error(\"Reader baseline top reading controls did not become visibly on-screen\")\n    }\n\n    private fun MacrobenchmarkScope.requireReadingSettingsClick() {\n        val bounds = readingSettingsBounds() ?: error(\"Reader baseline quick reading settings control missing\")\n        check(device.click(bounds.centerX(), bounds.centerY())) { \"Reader baseline quick reading settings tap was not injected\" }\n    }\n\n"
          assert text.count(old) == 1, 'baseline top controls anchor mismatch'
          text = text.replace(old, new)
          old_anchor = 'val anchor = visibleBounds(By.text("Aa")) ?: error("Reader baseline visible top Aa control missing")'
          assert text.count(old_anchor) == 1
          profile.write_text(text.replace(old_anchor, 'val anchor = readingSettingsBounds() ?: error("Reader baseline visible top settings control missing")'))
          contract = Path('scripts/verify-reader.sh')
          text = contract.read_text()
          anchor = "require_literal \"$smart_panel\" 'SmartToc.evaluate(state.chapters.map' 'bounded cache-eviction fallback'\n"
          addition = "forbid_literal \"$smart_panel\" 'chapters.map { ReaderTextPresentation.chapterTitle' 'eager all-chapter title presentation'\nrequire_literal \"$smart_panel\" 'val displayTitle = ReaderTextPresentation.chapterTitle(chapter.title, state.settings)' 'viewport-only chapter title presentation'\nrequire_literal \"$smart_panel\" 'val mid = (low + high) ushr 1' 'logarithmic current chapter lookup'\nrequire_literal \"$baseline\" 'visibleBounds(By.desc(\"Reading settings\")) ?: visibleBounds(By.text(\"Aa\"))' 'profile semantic settings selector'\n"
          assert text.count(anchor) == 1, 'Reader smart panel contract anchor mismatch'
          assert 'eager all-chapter title presentation' not in text
          contract.write_text(text.replace(anchor, anchor + addition))
          PY
          git diff --check
          bash scripts/verify-reader.sh
          python3 scripts/verify-reader-profile-contract.py
          python3 scripts/test-android-performance-slo.py
      - name: Commit fix and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reader-chapter-p99-fix.yml
          git add apps/android/app/src/main/java/com/junchen/jingdu/ReaderSmartChaptersPanel.kt apps/android/macrobenchmark/src/main/java/com/junchen/jingdu/macrobenchmark/BaselineProfileGenerator.kt scripts/verify-reader.sh
          git commit -m 'perf: keep chapter panel work viewport-bounded'
          git push origin HEAD:ux/reader-comprehensive
