name: Dependency Tooling Builder

on:
  push:
    branches: [chore/dependency-tooling-2026-09-02]

permissions:
  contents: write

jobs:
  build-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Apply tooling upgrades and remove builder
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('apps/android/build.gradle')
          s = p.read_text()
          s = s.replace('id "com.google.protobuf" version "0.9.5" apply false', 'id "com.google.protobuf" version "0.10.0" apply false')
          s = s.replace('id "com.google.devtools.ksp" version "2.3.10" apply false', 'id "com.google.devtools.ksp" version "2.3.11" apply false')
          p.write_text(s)

          old = 'actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5'
          new = 'actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0'
          for name in ['.github/workflows/ci.yml', '.github/workflows/android-physical-release-performance.yml']:
              q = Path(name)
              t = q.read_text()
              if old not in t:
                  raise SystemExit(f'expected setup-java v5 pin not found in {name}')
              q.write_text(t.replace(old, new))
          PY
          rm .github/workflows/dependency-tooling-builder.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/android/build.gradle .github/workflows/ci.yml .github/workflows/android-physical-release-performance.yml .github/workflows/dependency-tooling-builder.yml
          git commit -m 'build: update Android tooling dependencies'
          git push origin HEAD:chore/dependency-tooling-2026-09-02
