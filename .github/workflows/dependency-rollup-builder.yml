name: Dependency Rollup Builder

on:
  push:
    branches:
      - chore/dependency-rollup-2026-09-02

permissions:
  contents: write

jobs:
  build-rollup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Apply dependency upgrades and remove builder
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changes = {
              "apps/android/build.gradle": [
                  ('id "com.google.protobuf" version "0.9.5" apply false', 'id "com.google.protobuf" version "0.10.0" apply false'),
                  ('id "com.google.devtools.ksp" version "2.3.10" apply false', 'id "com.google.devtools.ksp" version "2.3.11" apply false'),
              ],
              "apps/android/readerproto/build.gradle": [
                  ('com.google.protobuf:protoc:4.32.1', 'com.google.protobuf:protoc:4.36.0'),
                  ('com.google.protobuf:protobuf-kotlin-lite:4.32.1', 'com.google.protobuf:protobuf-kotlin-lite:4.36.0'),
              ],
              "apps/android/app/build.gradle": [
                  ('androidx.room3:room3-runtime:3.0.1', 'androidx.room3:room3-runtime:3.0.2'),
                  ('androidx.room3:room3-compiler:3.0.1', 'androidx.room3:room3-compiler:3.0.2'),
              ],
              ".github/workflows/ci.yml": [
                  ('actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5', 'actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0'),
              ],
              ".github/workflows/android-physical-release-performance.yml": [
                  ('actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5', 'actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0'),
              ],
          }

          for name, replacements in changes.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"expected dependency token missing in {name}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

          grep -Fq 'com.google.protobuf" version "0.10.0"' apps/android/build.gradle
          grep -Fq 'com.google.devtools.ksp" version "2.3.11"' apps/android/build.gradle
          grep -Fq 'com.google.protobuf:protoc:4.36.0' apps/android/readerproto/build.gradle
          grep -Fq 'com.google.protobuf:protobuf-kotlin-lite:4.36.0' apps/android/readerproto/build.gradle
          grep -Fq 'androidx.room3:room3-runtime:3.0.2' apps/android/app/build.gradle
          grep -Fq 'androidx.room3:room3-compiler:3.0.2' apps/android/app/build.gradle
          test "$(grep -Rhc 'actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0' .github/workflows/ci.yml .github/workflows/android-physical-release-performance.yml | awk '{s+=$1} END {print s}')" -eq 4

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/android/build.gradle apps/android/readerproto/build.gradle apps/android/app/build.gradle .github/workflows/ci.yml .github/workflows/android-physical-release-performance.yml
          git rm .github/workflows/dependency-rollup-builder.yml
          git commit -m 'build: roll up pending dependency updates'
          git push origin HEAD:chore/dependency-rollup-2026-09-02
