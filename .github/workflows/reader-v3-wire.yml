name: Reader V3 one-shot wiring

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: github.head_ref == 'feat/reader-v3-prelaunch-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/reader-v3-prelaunch-final
          fetch-depth: 0
      - name: Apply UDF wiring
        run: |
          set -euo pipefail
          python3 scripts/patch-reader-v3-udf.py
          if git diff --quiet; then
            echo 'Reader V3 UDF wiring already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/android/app/src/main/java/com/junchen/jingdu/MainActivity.kt
          git commit -m 'refactor(reader): wire ViewModel StateFlow UDF'
          git push origin HEAD:feat/reader-v3-prelaunch-final
