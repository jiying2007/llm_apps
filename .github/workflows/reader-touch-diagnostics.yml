name: Reader touch diagnostics

on:
  push:
    branches: [ux/reader-comprehensive]
    paths: [.github/workflows/reader-touch-diagnostics.yml]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ux/reader-comprehensive
          fetch-depth: 0
      - name: Add read-only Reader touch diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/android/app/src/main/java/com/junchen/jingdu/ReaderExperience.kt')
          t = p.read_text()
          old = '    @Volatile var lastVolumeEligible: Boolean = false\n\n    fun resetVolumeDiagnostics() {'
          new = '    @Volatile var lastVolumeEligible: Boolean = false\n    @Volatile var controlsVisible: Boolean = true\n    @Volatile var centerTapCandidates: Long = 0L\n    @Volatile var centerTapDispatches: Long = 0L\n    @Volatile var lastTapDurationMs: Long = -1L\n    @Volatile var lastTapDistancePx: Float = -1f\n    @Volatile var lastTapConsumedByChild: Boolean = false\n\n    fun resetTouchDiagnostics() {\n        controlsVisible = true\n        centerTapCandidates = 0L\n        centerTapDispatches = 0L\n        lastTapDurationMs = -1L\n        lastTapDistancePx = -1f\n        lastTapConsumedByChild = false\n    }\n\n    fun resetVolumeDiagnostics() {'
          assert t.count(old) == 1, 'ReaderInteractionRuntime anchor mismatch'
          p.write_text(t.replace(old, new))
          p = Path('apps/android/app/src/main/java/com/junchen/jingdu/ReaderScreen.kt')
          t = p.read_text()
          old = '    var controlsVisible by controlsVisibility\n    var more by remember { mutableStateOf(false) }'
          new = '    var controlsVisible by controlsVisibility\n    SideEffect { ReaderInteractionRuntime.controlsVisible = controlsVisible }\n    var more by remember { mutableStateOf(false) }'
          assert t.count(old) == 1, 'Reader controls state anchor mismatch'
          t = t.replace(old, new)
          old = '            when (action) {\n                ReaderGestureAction.CONTROLS -> onToggleControls()'
          new = '            when (action) {\n                ReaderGestureAction.CONTROLS -> {\n                    ReaderInteractionRuntime.centerTapDispatches += 1L\n                    onToggleControls()\n                }'
          assert t.count(old) == 1, 'Reader dispatch anchor mismatch'
          t = t.replace(old, new)
          old = '            val delta = last.position - down.position\n            val duration = last.uptimeMillis - down.uptimeMillis\n            val edgeGuard = 8.dp.toPx()'
          new = '            val delta = last.position - down.position\n            val duration = last.uptimeMillis - down.uptimeMillis\n            ReaderInteractionRuntime.lastTapDurationMs = duration\n            ReaderInteractionRuntime.lastTapDistancePx = delta.getDistance()\n            ReaderInteractionRuntime.lastTapConsumedByChild = consumedByChild\n            val edgeGuard = 8.dp.toPx()'
          assert t.count(old) == 1, 'Reader gesture metric anchor mismatch'
          t = t.replace(old, new)
          old = '                    else -> {\n                        val centerAction = if (settings.advancedGestureCustomizationEnabled) settings.centerTapAction else ReaderGestureAction.CONTROLS'
          new = '                    else -> {\n                        ReaderInteractionRuntime.centerTapCandidates += 1L\n                        val centerAction = if (settings.advancedGestureCustomizationEnabled) settings.centerTapAction else ReaderGestureAction.CONTROLS'
          assert t.count(old) == 1, 'Reader center tap anchor mismatch'
          p.write_text(t.replace(old, new))
          p = Path('apps/android/app/src/benchmark/java/com/junchen/jingdu/ReaderBenchmarkFixtureProvider.kt')
          t = p.read_text()
          old = '                ReaderInteractionRuntime.continuousReady = false\n                ReaderInteractionRuntime.resetVolumeDiagnostics()'
          new = '                ReaderInteractionRuntime.continuousReady = false\n                ReaderInteractionRuntime.resetVolumeDiagnostics()\n                ReaderInteractionRuntime.resetTouchDiagnostics()'
          assert t.count(old) == 1, 'Benchmark diagnostic reset anchor mismatch'
          t = t.replace(old, new)
          old = '                    putBoolean("lastVolumeForegroundTtsPlaying", ReaderInteractionRuntime.lastVolumeForegroundTtsPlaying)\n                    putBoolean("lastVolumeEligible", ReaderInteractionRuntime.lastVolumeEligible)'
          new = '                    putBoolean("lastVolumeForegroundTtsPlaying", ReaderInteractionRuntime.lastVolumeForegroundTtsPlaying)\n                    putBoolean("lastVolumeEligible", ReaderInteractionRuntime.lastVolumeEligible)\n                    putBoolean("controlsVisible", ReaderInteractionRuntime.controlsVisible)\n                    putLong("centerTapCandidates", ReaderInteractionRuntime.centerTapCandidates)\n                    putLong("centerTapDispatches", ReaderInteractionRuntime.centerTapDispatches)\n                    putLong("lastTapDurationMs", ReaderInteractionRuntime.lastTapDurationMs)\n                    putFloat("lastTapDistancePx", ReaderInteractionRuntime.lastTapDistancePx)\n                    putBoolean("lastTapConsumedByChild", ReaderInteractionRuntime.lastTapConsumedByChild)'
          assert t.count(old) == 1, 'Benchmark inputState output anchor mismatch'
          p.write_text(t.replace(old, new))
          PY
          git diff --check
          bash scripts/verify-reader.sh
      - name: Commit diagnostics and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reader-touch-diagnostics.yml
          git add apps/android/app/src/main/java/com/junchen/jingdu/ReaderExperience.kt apps/android/app/src/main/java/com/junchen/jingdu/ReaderScreen.kt apps/android/app/src/benchmark/java/com/junchen/jingdu/ReaderBenchmarkFixtureProvider.kt
          git commit -m 'test: expose reader touch diagnostics'
          git push origin HEAD:ux/reader-comprehensive
