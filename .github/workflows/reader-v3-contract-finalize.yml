name: Reader V3 contract finalizer

on:
  push:
    branches:
      - feat/reader-v3-prelaunch-final
    paths:
      - .github/workflows/reader-v3-contract-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/reader-v3-prelaunch-final

      - name: Align Reader V3 static contract with draw-phase continuous path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-reader-v3.sh')
          text = path.read_text()
          old = '''require_literal "$fast_text" 'graphicsLayer { translationY = -scrollOffsetPx()' 'continuous cached layer translation'
          '''
          new = '''require_literal "$fast_text" 'Canvas(Modifier.fillMaxSize())' 'continuous viewport canvas'
          require_literal "$fast_text" 'canvas.translate(0f, -scrollOffsetPx().coerceIn(0f, maxOffset))' 'continuous draw-phase translation'
          forbid_literal "$fast_text" 'graphicsLayer { translationY = -scrollOffsetPx()' 'oversized continuous graphics layer'
          '''
          if old not in text:
              raise SystemExit('continuous static contract drifted')
          text = text.replace(old, new, 1)
          anchor = '''require_literal "$smart_panel" 'TocPanelCache' 'bounded panel cache'
          '''
          addition = '''require_literal "$smart_panel" 'TocPanelCache' 'bounded panel cache'
          require_literal "$smart_panel" 'prewarmReaderSmartChaptersPanel' 'reader-open panel cache promotion'
          require_literal "$activity" 'prewarmReaderSmartChaptersPanel(' 'reader-open Chapters prewarm'
          '''
          if anchor not in text:
              raise SystemExit('smart panel static contract drifted')
          text = text.replace(anchor, addition, 1)
          path.write_text(text)
          PY
          bash ./scripts/verify-reader-v3.sh

      - name: Commit contract alignment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reader-v3-contract-finalize.yml
          git add scripts/verify-reader-v3.sh
          git diff --cached --check
          git commit -m 'test(android): align Reader V3 hot-path contracts'
          git push origin HEAD:feat/reader-v3-prelaunch-final
