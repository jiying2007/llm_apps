name: Reader immersive confirmation fix

on:
  push:
    branches: [ux/reader-comprehensive]
    paths: [.github/workflows/reader-immersive-confirmation-fix.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ux/reader-comprehensive
          fetch-depth: 0
      - name: Suppress Android immersive onboarding in hosted Reader gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          runner = Path('scripts/run-android-macrobenchmark-ci.sh')
          text = runner.read_text()
          old = '"$ADB" shell input keyevent 82 || true\n"$ADB" shell settings put global window_animation_scale 0\n'
          new = ('"$ADB" shell input keyevent 82 || true\n'
                 '"$ADB" shell settings put secure immersive_mode_confirmations confirmed\n'
                 'immersive_confirmation="$("$ADB" shell settings get secure immersive_mode_confirmations | tr -d \'\\r\')"\n'
                 'if [[ "$immersive_confirmation" != "confirmed" ]]; then\n'
                 '  echo "Android immersive-mode confirmation was not suppressed: ${immersive_confirmation:-<empty>}" >&2\n'
                 '  exit 1\n'
                 'fi\n'
                 '"$ADB" shell settings put global window_animation_scale 0\n')
          assert text.count(old) == 1, 'hosted emulator settings anchor mismatch'
          assert 'immersive_mode_confirmations' not in text, 'immersive confirmation suppression already present'
          runner.write_text(text.replace(old, new))

          contract = Path('scripts/verify-reader-profile-contract.py')
          text = contract.read_text()
          anchor = 'assert \'GPU_MODE="${JINGDU_EMULATOR_GPU_MODE:-auto}"\' in runner, "hosted emulator must use the recommended auto graphics mode by default"\n'
          addition = ('assert \'settings put secure immersive_mode_confirmations confirmed\' in runner, "hosted emulator must suppress system immersive onboarding before Reader input"\n'
                      'assert \'settings get secure immersive_mode_confirmations\' in runner and \'immersive_confirmation\' in runner, "immersive onboarding suppression must be verified by read-back"\n')
          assert text.count(anchor) == 1, 'profile contract anchor mismatch'
          assert 'hosted emulator must suppress system immersive onboarding' not in text, 'immersive contract already present'
          contract.write_text(text.replace(anchor, anchor + addition))
          PY
          git diff --check
          python3 scripts/verify-reader-profile-contract.py
          python3 scripts/test-android-performance-slo.py
      - name: Commit fix and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reader-immersive-confirmation-fix.yml
          git add scripts/run-android-macrobenchmark-ci.sh scripts/verify-reader-profile-contract.py
          git commit -m 'ci: suppress Android immersive confirmation in Reader gate'
          git push origin HEAD:ux/reader-comprehensive
