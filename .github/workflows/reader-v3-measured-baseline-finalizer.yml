name: Reader V3 Measured Baseline Finalizer

on:
  push:
    branches: [feat/reader-v3-prelaunch-final]
    paths: [.github/workflows/reader-v3-measured-baseline-finalizer.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/reader-v3-prelaunch-final
          fetch-depth: 0
      - name: Apply evidence-backed Reader V3 baseline corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          engine_path = Path("apps/android/app/src/main/java/com/junchen/jingdu/ReaderViewportEngine.kt")
          engine = engine_path.read_text()
          engine = once(
              engine,
              '''        // Empirical hosted Macrobenchmark data showed that the 2 KiB experiment increased tail\n        // latency by forcing more window swaps/re-layouts during real swipes. Three KiB keeps several\n        // screens of headroom while retaining a bounded paragraph and the better measured steady state.\n        const val CONTINUOUS_WINDOW_CHARS = 3072L\n        const val CONTINUOUS_ALIGN_CHARS = 768L\n        const val CONTINUOUS_BACK_BUFFER_CHARS = 768L\n''',
              '''        // Hosted #642 measured the best continuous steady state with the original 4 KiB\n        // window (P95 55.1 ms versus 70+ ms after 3/2 KiB experiments). Keep multiple screens of\n        // headroom so real swipes do not churn window boundaries while remaining strictly bounded.\n        const val CONTINUOUS_WINDOW_CHARS = 4096L\n        const val CONTINUOUS_ALIGN_CHARS = 1024L\n        const val CONTINUOUS_BACK_BUFFER_CHARS = 1024L\n''',
              "restore measured 4K continuous window",
          )
          engine_path.write_text(engine)

          activity_path = Path("apps/android/app/src/main/java/com/junchen/jingdu/MainActivity.kt")
          activity = activity_path.read_text()
          activity = once(
              activity,
              '''                val overrides = TocOverrideStore(this).load(book.id, length)\n                val report = TocOverrideStore(this).apply(base, overrides)\n                main.post {\n''',
              '''                val overrides = TocOverrideStore(this).load(book.id, length)\n                val report = TocOverrideStore(this).apply(base, overrides)\n                // Materialize the potentially large chapter projection on the background TOC worker.\n                // The main thread only publishes an already-built immutable list.\n                val chapterModels = report.chapters.map { ChapterModel(it.offset, it.title, it.source, it.confidence) }\n                main.post {\n''',
              "chapter models off main thread",
          )
          activity = once(
              activity,
              '''                        chaptersLoaded = true,\n                        chapters = report.chapters.map { ChapterModel(it.offset, it.title, it.source, it.confidence) },\n''',
              '''                        chaptersLoaded = true,\n                        chapters = chapterModels,\n''',
              "publish prebuilt chapter models",
          )
          activity_path.write_text(activity)

          panel_path = Path("apps/android/app/src/main/java/com/junchen/jingdu/ReaderSmartChaptersPanel.kt")
          panel = panel_path.read_text()
          panel = once(
              panel,
              '''        val computedBase = cachedBase ?: withContext(Dispatchers.Default) {\n            // Cache eviction is harmless: this bounded fallback preserves correctness without making\n            // the panel dependent on cache availability.\n            SmartToc.evaluate(state.chapters.map { SmartChapter(it.offset, it.title, it.source, it.confidence) })\n        }\n        val computed = store.apply(computedBase, store.load(book.id, state.length))\n''',
              '''        val computedBase = cachedBase ?: withContext(Dispatchers.Default) {\n            // Cache eviction is harmless: this bounded fallback preserves correctness without making\n            // the panel dependent on cache availability.\n            SmartToc.evaluate(state.chapters.map { SmartChapter(it.offset, it.title, it.source, it.confidence) })\n        }\n        val overrides = withContext(Dispatchers.IO) { store.load(book.id, state.length) }\n        val computed = withContext(Dispatchers.Default) { store.apply(computedBase, overrides) }\n''',
              "panel overrides off main thread",
          )
          panel_path.write_text(panel)

          runner_path = Path("scripts/run-android-macrobenchmark-ci.sh")
          runner = runner_path.read_text()
          runner = once(
              runner,
              'GPU_MODE="software"\n',
              'GPU_MODE="${JINGDU_EMULATOR_GPU_MODE:-auto}"\n',
              "recommended emulator graphics mode",
          )
          runner_path.write_text(runner)

          v3_path = Path("scripts/verify-reader-v3.sh")
          v3 = v3_path.read_text()
          v3 = once(v3, "require_literal \"$engine\" 'CONTINUOUS_WINDOW_CHARS = 3072L' '3K continuous window'\n", "require_literal \"$engine\" 'CONTINUOUS_WINDOW_CHARS = 4096L' '4K continuous window'\n", "4K window contract")
          v3 = once(v3, "require_literal \"$engine\" 'CONTINUOUS_ALIGN_CHARS = 768L' 'continuous alignment'\n", "require_literal \"$engine\" 'CONTINUOUS_ALIGN_CHARS = 1024L' 'continuous alignment'\n", "4K alignment contract")
          v3 = once(v3, "require_literal \"$engine\" 'CONTINUOUS_BACK_BUFFER_CHARS = 768L' 'continuous back buffer'\n", "require_literal \"$engine\" 'CONTINUOUS_BACK_BUFFER_CHARS = 1024L' 'continuous back buffer'\n", "4K back buffer contract")
          anchor = "require_literal \"$activity\" 'smartTocCache.save(book.id, revision, length, report)' 'TOC cache write'\n"
          if anchor not in v3:
              raise SystemExit("TOC activity contract anchor missing")
          v3 = v3.replace(anchor, anchor + "require_literal \"$activity\" 'val chapterModels = report.chapters.map' 'chapter projection off main thread'\nrequire_literal \"$activity\" 'chapters = chapterModels' 'prebuilt chapter publication'\n", 1)
          panel_anchor = "require_literal \"$smart_panel\" 'derivedCache.load(book.id, book.normalizedSha256, state.length)' 'derived TOC reuse'\n"
          if panel_anchor not in v3:
              raise SystemExit("smart panel contract anchor missing")
          v3 = v3.replace(panel_anchor, panel_anchor + "require_literal \"$smart_panel\" 'val overrides = withContext(Dispatchers.IO)' 'panel override IO off main'\nrequire_literal \"$smart_panel\" 'withContext(Dispatchers.Default) { store.apply(computedBase, overrides) }' 'panel override projection off main'\n", 1)
          v3_path.write_text(v3)

          profile_contract_path = Path("scripts/verify-reader-profile-contract.py")
          profile_contract = profile_contract_path.read_text()
          profile_contract = once(
              profile_contract,
              'assert \'GPU_MODE="software"\' in runner\n',
              'assert \'GPU_MODE="${JINGDU_EMULATOR_GPU_MODE:-auto}"\' in runner, "hosted emulator must use the recommended auto graphics mode by default"\n',
              "emulator GPU contract",
          )
          profile_contract_path.write_text(profile_contract)
          PY

          bash scripts/verify-reader-v3.sh
          python3 scripts/verify-reader-profile-contract.py
          git diff --check
      - name: Commit measured baseline corrections and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reader-v3-measured-baseline-finalizer.yml
          git add apps/android/app/src/main/java/com/junchen/jingdu/ReaderViewportEngine.kt \
                  apps/android/app/src/main/java/com/junchen/jingdu/MainActivity.kt \
                  apps/android/app/src/main/java/com/junchen/jingdu/ReaderSmartChaptersPanel.kt \
                  scripts/run-android-macrobenchmark-ci.sh \
                  scripts/verify-reader-v3.sh \
                  scripts/verify-reader-profile-contract.py
          git commit -m "perf(android): restore measured reader baseline"
          git push origin HEAD:feat/reader-v3-prelaunch-final
