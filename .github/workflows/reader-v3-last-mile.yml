name: Reader V3 last-mile cut

on:
  push:
    branches:
      - feat/reader-v3-prelaunch-final
    paths:
      - .github/workflows/reader-v3-last-mile.yml
      - scripts/apply-reader-v3-last-mile.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/reader-v3-prelaunch-final

      - name: Apply and verify last-mile Reader V3 cut
        shell: bash
        run: |
          python3 scripts/apply-reader-v3-last-mile.py
          bash scripts/verify-reader-v3.sh
          python3 scripts/verify-reader-profile-contract.py
          git diff --check

      - name: Commit business cut and self-delete
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reader-v3-last-mile.yml scripts/apply-reader-v3-last-mile.py
          git add \
            apps/android/app/src/main/java/com/junchen/jingdu/ReaderScreenV3.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/JingduApp.kt \
            scripts/verify-reader-v3.sh \
            scripts/publish-source-release.py
          git diff --cached --check
          git commit -m 'perf(android): settle final Reader V3 interaction paths'
          git push origin HEAD:feat/reader-v3-prelaunch-final
