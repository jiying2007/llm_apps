name: Reader V3 volume lint fix

on:
  push:
    branches:
      - feat/reader-v3-prelaunch-final
    paths:
      - .github/workflows/reader-v3-volume-lint-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: feat/reader-v3-prelaunch-final

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply narrow volume dispatch lint contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          activity = Path('apps/android/app/src/main/java/com/junchen/jingdu/MainActivity.kt')
          text = activity.read_text()
          if 'import android.annotation.SuppressLint\n' not in text:
              text = text.replace('package com.junchen.jingdu\n\n', 'package com.junchen.jingdu\n\nimport android.annotation.SuppressLint\n', 1)
          target = '    override fun dispatchKeyEvent(event: KeyEvent): Boolean {\n'
          replacement = '    @SuppressLint("RestrictedApi") // ComponentActivity narrows the public Activity key-dispatch hook; required to intercept volume paging before system handling.\n' + target
          if replacement not in text:
              if target not in text:
                  raise SystemExit('dispatchKeyEvent target drifted')
              text = text.replace(target, replacement, 1)
          activity.write_text(text)

          contract = Path('scripts/verify-reader-v3.sh')
          c = contract.read_text()
          anchor = "require_literal \"$activity\" 'override fun dispatchKeyEvent(event: KeyEvent)' 'pre-system volume key dispatch'\n"
          addition = anchor + "require_literal \"$activity\" '@SuppressLint(\"RestrictedApi\") // ComponentActivity narrows the public Activity key-dispatch hook' 'narrow documented ComponentActivity volume-dispatch lint suppression'\n"
          if addition not in c:
              if anchor not in c:
                  raise SystemExit('volume dispatch contract drifted')
              c = c.replace(anchor, addition, 1)
          contract.write_text(c)
          PY
          bash scripts/verify-reader-v3.sh
          python3 scripts/verify-reader-profile-contract.py
          python3 scripts/test-android-performance-slo.py
          git diff --check
          cd apps/android
          ./gradlew :app:lintDebug :app:compileBenchmarkKotlin --no-daemon

      - name: Commit lint fix and self-delete
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/reader-v3-volume-lint-fix.yml
          git add apps/android/app/src/main/java/com/junchen/jingdu/MainActivity.kt scripts/verify-reader-v3.sh
          git diff --cached --check
          git commit -m 'fix(android): document Reader V3 volume dispatch lint boundary'
          git push origin HEAD:feat/reader-v3-prelaunch-final
