name: Reader UIAutomator diagnostics

on:
  push:
    branches: [ux/reader-comprehensive]
    paths: [.github/workflows/reader-uiautomator-diagnostics.yml]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ux/reader-comprehensive
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Patch one-journey UIAutomator evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          benchmark = Path('apps/android/macrobenchmark/src/main/java/com/junchen/jingdu/macrobenchmark/ReaderJourneyBenchmark.kt')
          text = benchmark.read_text()
          anchor = '    private fun MacrobenchmarkScope.ensureTopControlsVisible() {\n'
          assert text.count(anchor) == 1, 'ensureTopControlsVisible anchor mismatch'
          diagnostic = (
              '    private fun MacrobenchmarkScope.readerTopControlsDiagnostics(): String {\n'
              '        val remoteDir = "/sdcard/Download/jingdu-reader-ci/macro"\n'
              '        fun describe(label: String, selector: BySelector): String {\n'
              '            val nodes = device.findObjects(selector)\n'
              '            if (nodes.isEmpty()) return "$label=<none>"\n'
              '            return nodes.mapIndexed { index, node ->\n'
              '                val bounds = runCatching { node.visibleBounds.toString() }.getOrDefault("<stale>")\n'
              '                val onScreen = runCatching { isOnScreen(node) }.getOrDefault(false)\n'
              '                "$label[$index]=$bounds,onScreen=$onScreen"\n'
              '            }.joinToString(";")\n'
              '        }\n'
              '        val dump = runCatching { device.executeShellCommand("uiautomator dump $remoteDir/reader-controls-hierarchy.xml").trim() }.getOrElse { "dump-error=${it.javaClass.simpleName}" }\n'
              '        val screenshot = runCatching { device.executeShellCommand("screencap -p $remoteDir/reader-controls-failure.png").trim() }.getOrElse { "screencap-error=${it.javaClass.simpleName}" }\n'
              '        return listOf(\n'
              '            describe("settings", By.desc("Reading settings")),\n'
              '            describe("chapters", By.desc("Chapters")),\n'
              '            describe("title", By.textContains("Benchmark Novel")),\n'
              '            "display=${device.displayWidth}x${device.displayHeight}",\n'
              '            "dump=${dump.ifEmpty { "<empty>" }}",\n'
              '            "screencap=${screenshot.ifEmpty { "<empty>" }}",\n'
              '        ).joinToString(" | ")\n'
              '    }\n\n'
          )
          text = text.replace(anchor, diagnostic + anchor)
          old = '                "runtime=${readerInputState()}",\n'
          new = '                "runtime=${readerInputState()}; ui=${readerTopControlsDiagnostics()}",\n'
          assert text.count(old) == 1, 'runtime error anchor mismatch'
          benchmark.write_text(text.replace(old, new))

          runner = Path('scripts/run-android-macrobenchmark-ci.sh')
          text = runner.read_text()
          anchor = 'MACRO_CLASS="com.junchen.jingdu.macrobenchmark.ReaderJourneyBenchmark"\n'
          assert text.count(anchor) == 1, 'macro class anchor mismatch'
          text = text.replace(anchor, anchor + 'MACRO_CLASS="${JINGDU_MACRO_CLASS:-$MACRO_CLASS}"\n')
          anchor = '"$ADB" pull "$REMOTE_JSON" "$RESULT_ROOT/macro/"\n\n'
          assert text.count(anchor) == 1, 'macro result pull anchor mismatch'
          text = text.replace(anchor, anchor + 'if [[ "${JINGDU_MACRO_DIAGNOSTIC_ONLY:-0}" == "1" ]]; then\n  echo "UIAutomator diagnostic journey completed successfully"\n  exit 0\nfi\n\n')
          runner.write_text(text)
          PY
          git diff --check
      - name: Run hosted diagnostic journey
        id: diagnostic
        continue-on-error: true
        shell: bash
        env:
          JINGDU_MACRO_CLASS: com.junchen.jingdu.macrobenchmark.ReaderJourneyBenchmark#chaptersAndSettings10MiB
          JINGDU_MACRO_DIAGNOSTIC_ONLY: '1'
        run: bash ./scripts/run-android-macrobenchmark-ci.sh
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reader-uiautomator-diagnostics-${{ github.sha }}
          path: |
            apps/android/macrobenchmark/build/outputs/
            ${{ runner.temp }}/jingdu-emulator.log
          if-no-files-found: warn
          retention-days: 14
      - name: Self-remove diagnostic workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- apps/android/macrobenchmark/src/main/java/com/junchen/jingdu/macrobenchmark/ReaderJourneyBenchmark.kt scripts/run-android-macrobenchmark-ci.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reader-uiautomator-diagnostics.yml
          git commit -m 'ci: remove reader UIAutomator diagnostics'
          git push origin HEAD:ux/reader-comprehensive
      - name: Propagate diagnostic failure
        if: steps.diagnostic.outcome == 'failure'
        shell: bash
        run: exit 1
