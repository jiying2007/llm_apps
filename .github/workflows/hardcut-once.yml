name: Android hard cut once

on:
  push:
    branches:
      - release/source-v2.3.1

permissions:
  contents: write

jobs:
  hardcut:
    if: contains(github.event.head_commit.message, '[hardcut-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact release branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: release/source-v2.3.1
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply, validate and self-remove hard cut
        run: python3 scripts/hardcut-once.py
