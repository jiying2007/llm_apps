name: Reader V3 display-list prewarm

on:
  push:
    branches:
      - feat/reader-v3-prelaunch-final
    paths:
      - .github/workflows/reader-v3-displaylist-prewarm.yml
      - scripts/apply-reader-v3-displaylist-prewarm.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: feat/reader-v3-prelaunch-final

      - name: Apply and verify Reader V3 display-list prewarm
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          patch = Path('scripts/apply-reader-v3-displaylist-prewarm.py')
          source = patch.read_text()
          needle = 'verify = verify_path.read_text()\n'
          addition = '''verify = verify.replace(
              "hot_controls=apps/android/app/src/main/java/com/junchen/jingdu/ReaderHotControls.kt\\nfast_text=apps/android/app/src/main/java/com/junchen/jingdu/ReaderFastText.kt\\n",
              "hot_controls=apps/android/app/src/main/java/com/junchen/jingdu/ReaderHotControls.kt\\nhot_panel_canvas=apps/android/app/src/main/java/com/junchen/jingdu/ReaderHotPanelCanvas.kt\\nfast_text=apps/android/app/src/main/java/com/junchen/jingdu/ReaderFastText.kt\\n",
              1,
          )
          verify = verify.replace(
              "require_literal \\\"$app\\\" '.semantics { if (panelState.value != target) invisibleToUser() }' 'phase-owned hidden panel semantics'\\n",
              "require_literal \\\"$app\\\" '.semantics { if (panelState.value != target) hideFromAccessibility() }' 'phase-owned hidden panel semantics'\\n",
              1,
          )
          '''
          if needle not in source:
              raise SystemExit('verify contract staging point drifted')
          patch.write_text(source.replace(needle, needle + addition, 1))
          PY
          python3 scripts/apply-reader-v3-displaylist-prewarm.py
          bash scripts/verify-reader-v3.sh
          python3 scripts/verify-reader-profile-contract.py
          git diff --check

      - name: Commit business cut and self-delete
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/reader-v3-displaylist-prewarm.yml scripts/apply-reader-v3-displaylist-prewarm.py
          git add \
            apps/android/app/src/main/java/com/junchen/jingdu/ReaderFastText.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/ReaderHotPanelCanvas.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/ReaderQuickPanels.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/ReaderSmartChaptersPanel.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/JingduApp.kt \
            scripts/verify-reader-v3.sh
          git diff --cached --check
          git commit -m 'perf(android): pre-record Reader V3 hot display lists'
          git push origin HEAD:feat/reader-v3-prelaunch-final
