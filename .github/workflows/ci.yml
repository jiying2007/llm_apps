name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build, test and analyze shared core
        run: ./scripts/check-native.sh

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android product verification
        run: ./gradlew --no-daemon --warning-mode all androidCheck
      - name: Print complete Android lint failures
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(
            app/build/intermediates/lint_intermediate_text_report/*/*/lint-results-*.txt
            app/build/reports/lint-results-*.txt
          )
          if ((${#reports[@]})); then
            for report in "${reports[@]}"; do
              echo "===== ${report} ====="
              cat "$report"
            done
          else
            echo "No lint text report was produced; failure occurred before lint reporting."
          fi
      - name: Android Reader and localization contract
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-android-i18n.py
          bash ./scripts/verify-reader.sh
          python3 -m py_compile scripts/check-android-performance-slo.py
          bash -n scripts/run-android-macrobenchmark-ci.sh

  android-performance:
    needs: android
    # Pin the hosted regression environment to Ubuntu 22.04 + Android 35. Emulator timing is
    # guarded by the checked-in baseline + 15% budget and 160/220 anti-drift ceilings; 40/80 is
    # exclusively the physical-device Release SLO.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run Reader hosted Macrobenchmark and enforce frame SLO
        run: bash ./scripts/run-android-macrobenchmark-ci.sh
      - name: Preserve Macrobenchmark evidence and failure Perfetto traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reader-macrobenchmark-${{ github.sha }}
          path: |
            apps/android/macrobenchmark/build/outputs/
            ${{ runner.temp }}/jingdu-emulator.log
          if-no-files-found: warn
          retention-days: 14

  harmony-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate Harmony terminal contract
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/harmony/build-profile.json5
          test -f apps/harmony/entry/build-profile.json5
          test -f apps/harmony/entry/src/main/module.json5
          test -f apps/harmony/entry/src/main/cpp/napi_init.cpp
          test -f apps/harmony/entry/src/main/ets/pages/Index.ets
          test -f apps/harmony/entry/src/main/ets/model/BookStore.ets
          test -f apps/harmony/entry/src/main/ets/model/BackgroundTasks.ets
          test -f apps/harmony/entry/src/main/ets/model/ReaderController.ets
          test -f apps/harmony/entry/src/main/ets/model/TtsController.ets
          grep -q 'core/native' apps/harmony/entry/src/main/cpp/CMakeLists.txt
          grep -q 'abiVersion() !== 2' apps/harmony/entry/src/main/ets/model/BackgroundTasks.ets
          grep -q '@Concurrent' apps/harmony/entry/src/main/ets/model/BackgroundTasks.ets
          grep -q 'openDocumentTask' apps/harmony/entry/src/main/ets/model/BackgroundTasks.ets
          grep -q 'document-${normalizedSha256}.txt' apps/harmony/entry/src/main/ets/model/BackgroundTasks.ets
          grep -q 'clean-${revision}.txt' apps/harmony/entry/src/main/ets/model/BackgroundTasks.ets
          grep -q "name.endsWith('.jdx')" apps/harmony/entry/src/main/ets/model/BackgroundTasks.ets
          grep -q 'await this.reader.open' apps/harmony/entry/src/main/ets/pages/Index.ets
          grep -q 'DocumentViewPicker' apps/harmony/entry/src/main/ets/pages/Index.ets

  play-store-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate Play metadata and lifetime Pro contract
        run: bash ./scripts/verify-play-store.sh

  terminal-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify terminal source and long-form quality contracts
        run: |
          set -euo pipefail
          python3 ./scripts/verify-android-source-conventions.py
          ./scripts/verify-terminal.sh
          bash ./scripts/verify-terminal-quality.sh

  publish-source-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native-core, android, android-performance, harmony-contract, play-store-contract, terminal-contract]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Publish immutable source release and prune closed temporary branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
          MAIN_SHA: ${{ github.sha }}
        run: python3 ./scripts/publish-source-release.py

  publish-android-debug-apk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-source-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build debug-key-signed APK from immutable source tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version: v//p' releases/source/v2.3.1.md | head -n1)"
          TAG="v${VERSION}"
          test "$TAG" = "v2.3.1"
          TAG_SHA="$(git rev-list -n 1 "$TAG")"
          test "$TAG_SHA" = "30c72dbea26d338f37a515392f152b8a5f6a9793"
          git checkout --detach "$TAG_SHA"

          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [[ ! -f "$DEBUG_KEYSTORE" ]]; then
            keytool -genkeypair -v \
              -keystore "$DEBUG_KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cat > apps/android/keystore.properties <<EOF
          storeFile=$DEBUG_KEYSTORE
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

          cd apps/android
          ./gradlew --no-daemon --no-configuration-cache --warning-mode all \
            -PjingduApplicationId=com.junchen.jingdu \
            -PjingduVersionCode=7 \
            -PjingduVersionName="$VERSION" \
            validateStoreRelease assembleRelease

          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          grep -q 'Signer #1 certificate DN: CN=Android Debug' "$RUNNER_TEMP/apksigner.txt"

          mkdir -p "$RUNNER_TEMP/jingdu-release"
          OUT="$RUNNER_TEMP/jingdu-release/Jingdu-v${VERSION}-debug-signed.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | sed "s#  .*#  $(basename "$OUT")#" > "$RUNNER_TEMP/jingdu-release/SHA256SUMS.txt"
          grep 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/apksigner.txt" > "$RUNNER_TEMP/jingdu-release/SIGNING-CERT-SHA256.txt"

          gh release upload "$TAG" \
            "$OUT" \
            "$RUNNER_TEMP/jingdu-release/SHA256SUMS.txt" \
            "$RUNNER_TEMP/jingdu-release/SIGNING-CERT-SHA256.txt" \
            --repo "$GITHUB_REPOSITORY" --clobber

          BODY="$RUNNER_TEMP/release-body.md"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$BODY"
          if ! grep -q 'Jingdu-v2.3.1-debug-signed.apk' "$BODY"; then
            cat >> "$BODY" <<'EOF'

          ## Android APK

          `Jingdu-v2.3.1-debug-signed.apk` is built from the immutable `v2.3.1` source tag and signed with the standard Android debug key (`androiddebugkey`) used for the current pre-production stage. `SHA256SUMS.txt` and `SIGNING-CERT-SHA256.txt` are published alongside it.

          This downloadable APK is **not Google Play production signing or rollout evidence**.
          EOF
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$BODY"
          fi
