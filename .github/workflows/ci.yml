name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build, test and analyze shared core
        run: ./scripts/check-native.sh

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android product verification
        run: ./gradlew --no-daemon --warning-mode all androidCheck
      - name: Android product localization and monetization contract
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            apps/android/app/src/main/java/com/junchen/jingdu/MainActivity.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/JingduApp.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/LibraryScreen.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/ReaderScreen.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/ReaderSheets.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/ProductSettingsSheet.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/UiComponents.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/UiFormatters.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/ReaderPreferences.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/UiModels.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/NativeIndexCache.java \
            apps/android/app/src/main/java/com/junchen/jingdu/BillingManager.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/ReviewPrompter.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/RuleCodec.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/RuleLibrary.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/UserBackup.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/ChineseScript.java \
            apps/android/app/src/androidTest/java/com/junchen/jingdu/JingduUiTest.kt; do
            test -f "$path"
          done
          test ! -f apps/android/app/src/main/java/com/junchen/jingdu/MainActivity.java
          test ! -f apps/android/app/src/main/java/com/junchen/jingdu/JingduUi.kt
          ! grep -q 'android.permission.INTERNET' apps/android/app/src/main/AndroidManifest.xml
          python3 scripts/verify-android-i18n.py

          grep -q 'enableEdgeToEdge' apps/android/app/src/main/java/com/junchen/jingdu/MainActivity.kt
          grep -q 'newSingleThreadExecutor' apps/android/app/src/main/java/com/junchen/jingdu/MainActivity.kt
          grep -q 'OpenMultipleDocuments' apps/android/app/src/main/java/com/junchen/jingdu/MainActivity.kt
          grep -q 'restoreSession' apps/android/app/src/main/java/com/junchen/jingdu/MainActivity.kt
          grep -q 'STATE_NORMALIZED_SHA' apps/android/app/src/main/java/com/junchen/jingdu/MainActivity.kt
          grep -q 'bookmarkKey(book)' apps/android/app/src/main/java/com/junchen/jingdu/MainActivity.kt
          grep -q 'repository.redecode' apps/android/app/src/main/java/com/junchen/jingdu/MainActivity.kt
          grep -q 'analyzeSmartClean' apps/android/app/src/main/java/com/junchen/jingdu/MainActivity.kt
          grep -q 'UserBackup' apps/android/app/src/main/java/com/junchen/jingdu/MainActivity.kt
          grep -q 'refreshTtsVoices' apps/android/app/src/main/java/com/junchen/jingdu/MainActivity.kt
          grep -q 'ReviewPrompter' apps/android/app/src/main/java/com/junchen/jingdu/MainActivity.kt
          grep -q 'NativeIndexCache.pruneOrphans' apps/android/app/src/main/java/com/junchen/jingdu/MainActivity.kt

          grep -q 'GridCells.Adaptive' apps/android/app/src/main/java/com/junchen/jingdu/LibraryScreen.kt
          grep -q 'R.string.batch_import' apps/android/app/src/main/java/com/junchen/jingdu/LibraryScreen.kt
          grep -q 'widthIn(max = maxTextWidth)' apps/android/app/src/main/java/com/junchen/jingdu/ReaderScreen.kt
          grep -q 'onValueChangeFinished' apps/android/app/src/main/java/com/junchen/jingdu/ReaderScreen.kt
          grep -q 'R.string.smart_clean' apps/android/app/src/main/java/com/junchen/jingdu/ReaderSheets.kt
          grep -q 'R.string.unlock_pro_apply' apps/android/app/src/main/java/com/junchen/jingdu/ReaderSheets.kt
          grep -q 'ProductSettingsSheet' apps/android/app/src/main/java/com/junchen/jingdu/JingduApp.kt
          grep -q 'R.string.offline_voice' apps/android/app/src/main/java/com/junchen/jingdu/ProductSettingsSheet.kt
          grep -q 'R.string.local_asset_backup' apps/android/app/src/main/java/com/junchen/jingdu/ProductSettingsSheet.kt

          grep -q 'ATOMIC_MOVE' apps/android/app/src/main/java/com/junchen/jingdu/BookRepository.java
          grep -q 'document-' apps/android/app/src/main/java/com/junchen/jingdu/BookRepository.java
          grep -q 'clean-' apps/android/app/src/main/java/com/junchen/jingdu/BookRepository.java
          grep -q 'NativeCore.search(handle' apps/android/app/src/main/java/com/junchen/jingdu/ReaderController.java
          grep -q 'ChineseScript.searchVariants' apps/android/app/src/main/java/com/junchen/jingdu/ReaderController.java
          grep -q 'NativeCore.chapters(handle' apps/android/app/src/main/java/com/junchen/jingdu/ReaderController.java
          grep -q 'NativeCore.noiseCandidates' apps/android/app/src/main/java/com/junchen/jingdu/ReaderController.java
          grep -q 'detectDocumentLocale' apps/android/app/src/main/java/com/junchen/jingdu/TtsController.java
          grep -q 'nativeNoiseCandidates' apps/android/app/src/main/java/com/junchen/jingdu/NativeCore.java

          grep -q 'jingdu_pro_lifetime' apps/android/app/src/main/java/com/junchen/jingdu/BillingManager.kt
          grep -q 'queryPurchasesAsync' apps/android/app/src/main/java/com/junchen/jingdu/BillingManager.kt
          grep -q 'acknowledgePurchase' apps/android/app/src/main/java/com/junchen/jingdu/BillingManager.kt
          grep -q 'billing:9.1.0' apps/android/app/build.gradle
          grep -q 'review:2.0.2' apps/android/app/build.gradle
          grep -q 'compose-bom:2026.08.00' apps/android/app/build.gradle
          grep -q 'compileSdk = 37' apps/android/app/build.gradle
          grep -q 'generateLocaleConfig = true' apps/android/app/build.gradle

  harmony-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate Harmony terminal contract
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/harmony/build-profile.json5
          test -f apps/harmony/entry/build-profile.json5
          test -f apps/harmony/entry/src/main/module.json5
          test -f apps/harmony/entry/src/main/cpp/napi_init.cpp
          test -f apps/harmony/entry/src/main/ets/pages/Index.ets
          test -f apps/harmony/entry/src/main/ets/model/BookStore.ets
          test -f apps/harmony/entry/src/main/ets/model/BackgroundTasks.ets
          test -f apps/harmony/entry/src/main/ets/model/ReaderController.ets
          test -f apps/harmony/entry/src/main/ets/model/TtsController.ets
          grep -q 'core/native' apps/harmony/entry/src/main/cpp/CMakeLists.txt
          grep -q 'abiVersion() !== 2' apps/harmony/entry/src/main/ets/model/BackgroundTasks.ets
          grep -q '@Concurrent' apps/harmony/entry/src/main/ets/model/BackgroundTasks.ets
          grep -q 'openDocumentTask' apps/harmony/entry/src/main/ets/model/BackgroundTasks.ets
          grep -q 'document-${normalizedSha256}.txt' apps/harmony/entry/src/main/ets/model/BackgroundTasks.ets
          grep -q 'clean-${revision}.txt' apps/harmony/entry/src/main/ets/model/BackgroundTasks.ets
          grep -q "name.endsWith('.jdx')" apps/harmony/entry/src/main/ets/model/BackgroundTasks.ets
          grep -q 'await this.reader.open' apps/harmony/entry/src/main/ets/pages/Index.ets
          grep -q 'pruneRevisionsTask' apps/harmony/entry/src/main/ets/pages/Index.ets
          grep -q 'if (!this.cleanMode) this.store.saveProgress' apps/harmony/entry/src/main/ets/pages/Index.ets
          grep -q '&& !this.cleanMode' apps/harmony/entry/src/main/ets/pages/Index.ets
          grep -q 'sourceSha256' apps/harmony/entry/src/main/ets/model/BookStore.ets
          grep -q 'existing.normalizedSha256 === result.normalizedSha256' apps/harmony/entry/src/main/ets/model/BookStore.ets
          grep -q '@kit.CoreSpeechKit' apps/harmony/entry/src/main/ets/model/TtsController.ets
          grep -q 'DocumentViewPicker' apps/harmony/entry/src/main/ets/pages/Index.ets

  play-store-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate Play metadata and lifetime Pro contract
        run: bash ./scripts/verify-play-store.sh

  terminal-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify terminal source and long-form quality contracts
        run: |
          set -euo pipefail
          ./scripts/verify-terminal.sh
          bash ./scripts/verify-terminal-quality.sh

  publish-source-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native-core, android, harmony-contract, play-store-contract, terminal-contract]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Publish immutable source release and prune closed temporary branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
          MAIN_SHA: ${{ github.sha }}
        run: python3 ./scripts/publish-source-release.py
