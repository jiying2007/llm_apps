name: Source Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: source-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve exact-main source release request
        id: request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          api = os.environ["GH_API_URL"]
          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          ci_sha = os.environ["CI_HEAD_SHA"]
          output = os.environ["GITHUB_OUTPUT"]

          def request(path: str):
              req = urllib.request.Request(
                  f"{api}/repos/{repo}{path}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"GitHub API GET {path} failed: {error.code} {detail}")

          main_ref = request("/git/ref/heads/main")
          main_sha = main_ref["object"]["sha"]
          if ci_sha != main_sha:
              print(f"ignore completed CI for non-current main: ci={ci_sha} current={main_sha}")
              with open(output, "a", encoding="utf-8") as stream:
                  stream.write("requested=false\n")
              raise SystemExit(0)

          refs = request("/git/matching-refs/heads/release/source-v") or []
          matches = []
          for item in refs:
              ref = item.get("ref", "")
              sha = (item.get("object") or {}).get("sha")
              name = ref.removeprefix("refs/heads/")
              parsed = re.fullmatch(r"release/source-v(\d+\.\d+\.\d+)", name)
              if parsed and sha == main_sha:
                  matches.append((name, parsed.group(1)))

          if not matches:
              print(f"no source release request points at current main {main_sha}")
              with open(output, "a", encoding="utf-8") as stream:
                  stream.write("requested=false\n")
              raise SystemExit(0)
          if len(matches) != 1:
              raise SystemExit(f"ambiguous source release requests for {main_sha}: {matches}")

          release_ref, version = matches[0]
          with open(output, "a", encoding="utf-8") as stream:
              stream.write("requested=true\n")
              stream.write(f"release_ref={release_ref}\n")
              stream.write(f"version={version}\n")
              stream.write(f"tag=v{version}\n")
              stream.write(f"sha={main_sha}\n")
          print(f"resolved source release request: {release_ref} -> {main_sha}")
          PY

      - name: Verify source release version
        if: steps.request.outputs.requested == 'true'
        env:
          RELEASE_VERSION: ${{ steps.request.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          app_gradle = Path("apps/android/app/build.gradle").read_text(encoding="utf-8")
          root_gradle = Path("apps/android/build.gradle").read_text(encoding="utf-8")
          app_match = re.search(r'versionNameProperty\.getOrElse\("([^\"]+)"\)', app_gradle)
          root_match = re.search(r'jingduVersionName"\)\.getOrElse\("([^\"]+)"\)', root_gradle)
          if not app_match or not root_match:
              raise SystemExit("unable to resolve Android release version defaults")
          if app_match.group(1) != version or root_match.group(1) != version:
              raise SystemExit(
                  f"release version drift: requested={version} app={app_match.group(1)} staging={root_match.group(1)}"
              )
          print(f"source release version verified: {version}")
          PY

      - name: Verify terminal source and store contracts
        if: steps.request.outputs.requested == 'true'
        run: |
          set -euo pipefail
          ./scripts/verify-terminal.sh
          ./scripts/verify-play-store.sh

      - name: Create idempotent source release and prune merged branches
        if: steps.request.outputs.requested == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
          RELEASE_REF: ${{ steps.request.outputs.release_ref }}
          SOURCE_RELEASE_VERSION: ${{ steps.request.outputs.version }}
          SOURCE_RELEASE_TAG: ${{ steps.request.outputs.tag }}
          SOURCE_RELEASE_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          api = os.environ["GH_API_URL"]
          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          release_ref = os.environ["RELEASE_REF"]
          version = os.environ["SOURCE_RELEASE_VERSION"]
          tag = os.environ["SOURCE_RELEASE_TAG"]
          main_sha = os.environ["SOURCE_RELEASE_SHA"]
          temporary_prefixes = (
              "feat/", "fix/", "chore/", "ci/", "refactor/", "docs/", "test/", "perf/"
          )

          def request(path: str, method: str = "GET", payload=None, allow_404: bool = False, allow_422: bool = False):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"{api}/repos/{repo}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      body = response.read()
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  if allow_404 and error.code == 404:
                      return 404, None
                  if allow_422 and error.code == 422:
                      return 422, None
                  detail = error.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"GitHub API {method} {path} failed: {error.code} {detail}")

          _, main_ref = request("/git/ref/heads/main")
          if main_ref["object"]["sha"] != main_sha:
              raise SystemExit(f"main advanced during source release: expected={main_sha} current={main_ref['object']['sha']}")

          tag_path = f"/git/ref/tags/{urllib.parse.quote(tag, safe='')}"
          tag_status, tag_ref = request(tag_path, allow_404=True)
          if tag_status != 404 and tag_ref["object"]["sha"] != main_sha:
              raise SystemExit(f"existing tag {tag} does not point at release SHA {main_sha}")

          release_status, release = request(
              f"/releases/tags/{urllib.parse.quote(tag, safe='')}", allow_404=True
          )
          if release_status == 404:
              body = (
                  f"Jingdu {tag} source release.\n\n"
                  "This release records immutable source provenance for the Android v2.2 line. "
                  "No signed APK/AAB is attached here; Google Play production rollout still requires "
                  "the retained upload key, Play Console product/listing setup, license-test evidence, "
                  "and staged rollout defined in `docs/RELEASE.md`.\n\n"
                  "Highlights: Simplified/Traditional/English UI, four-region Play metadata, "
                  "Simplified/Traditional Smart Clean, cross-script search, document-language-aware TTS, "
                  "lifetime Pro, and localization/release quality gates."
              )
              _, release = request(
                  "/releases",
                  method="POST",
                  payload={
                      "tag_name": tag,
                      "target_commitish": main_sha,
                      "name": f"Jingdu {tag}",
                      "body": body,
                      "draft": False,
                      "prerelease": False,
                      "make_latest": "true",
                      "generate_release_notes": True,
                  },
              )
              print(f"created source release: {release.get('html_url')}")
          else:
              print(f"source release already exists: {release.get('html_url')}")

          _, final_tag = request(tag_path)
          if final_tag["object"]["sha"] != main_sha:
              raise SystemExit(f"release tag {tag} does not resolve to {main_sha}")

          _, open_pulls = request("/pulls?state=open&per_page=100")
          open_heads = {
              pr["head"]["ref"]
              for pr in open_pulls
              if pr.get("head", {}).get("repo", {}).get("full_name") == repo
          }
          _, closed_pulls = request("/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=100")
          merged_heads = []
          for pr in closed_pulls:
              head = pr.get("head") or {}
              head_repo = head.get("repo") or {}
              ref = head.get("ref")
              if not pr.get("merged_at") or head_repo.get("full_name") != repo or not ref:
                  continue
              if ref == "main" or ref in open_heads or ref.startswith("release/source-v"):
                  continue
              if not ref.startswith(temporary_prefixes):
                  continue
              if ref not in merged_heads:
                  merged_heads.append(ref)

          for ref in merged_heads:
              path = f"/git/refs/heads/{urllib.parse.quote(ref, safe='/')}"
              status, _ = request(path, method="DELETE", allow_404=True, allow_422=True)
              if status in (204, 404, 422):
                  print(f"pruned merged branch: {ref}")

          trigger_path = f"/git/refs/heads/{urllib.parse.quote(release_ref, safe='/')}"
          status, _ = request(trigger_path, method="DELETE", allow_404=True, allow_422=True)
          if status not in (204, 404, 422):
              raise SystemExit(f"unable to remove release trigger branch: {release_ref}")
          print(f"removed release trigger branch: {release_ref}")
          PY
