name: Reader V3 graphics import fix

on:
  push:
    branches:
      - feat/reader-v3-prelaunch-final
    paths:
      - .github/workflows/reader-v3-graphics-import-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: feat/reader-v3-prelaunch-final

      - name: Restore graphicsLayer import and verify contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/android/app/src/main/java/com/junchen/jingdu/JingduApp.kt')
          text = path.read_text()
          anchor = 'import androidx.compose.ui.graphics.Color\n'
          required = 'import androidx.compose.ui.graphics.graphicsLayer\n'
          if required not in text:
              if anchor not in text:
                  raise SystemExit('JingduApp graphics import anchor drifted')
              text = text.replace(anchor, anchor + required, 1)
          path.write_text(text)
          PY
          python3 scripts/test-android-performance-slo.py
          bash scripts/verify-reader-v3.sh
          python3 scripts/verify-reader-profile-contract.py
          git diff --check

      - name: Commit import fix and self-delete
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/reader-v3-graphics-import-fix.yml
          git add apps/android/app/src/main/java/com/junchen/jingdu/JingduApp.kt
          git diff --cached --check
          git commit -m 'fix(android): restore hot-panel graphics layer import'
          git push origin HEAD:feat/reader-v3-prelaunch-final
