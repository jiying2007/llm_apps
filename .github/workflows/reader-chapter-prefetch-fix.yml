name: Reader chapter prefetch fix

on:
  push:
    branches:
      - release/source-v2.3.2
    paths:
      - .github/workflows/reader-chapter-prefetch-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: release/source-v2.3.2
          fetch-depth: 0
      - name: Disable Chapters lazy prefetch contention
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('apps/android/app/src/main/java/com/junchen/jingdu/ReaderChapterListState.kt')
          assert not helper.exists(), 'Reader chapter list helper already exists'
          helper.write_text('''@file:OptIn(androidx.compose.foundation.ExperimentalFoundationApi::class)\npackage com.junchen.jingdu\n\nimport androidx.compose.foundation.lazy.LazyListLayoutInfo\nimport androidx.compose.foundation.lazy.LazyListPrefetchScope\nimport androidx.compose.foundation.lazy.LazyListPrefetchStrategy\nimport androidx.compose.foundation.lazy.LazyListState\nimport androidx.compose.foundation.lazy.layout.NestedPrefetchScope\nimport androidx.compose.runtime.Composable\nimport androidx.compose.runtime.remember\n\n/**\n * Chapters is already kept composed and measured off-screen for the Reader session. Avoid\n * competing idle precompose/premeasure work when the live list first becomes visible or scrolls.\n */\nprivate object ReaderChapterNoPrefetchStrategy : LazyListPrefetchStrategy {\n    override fun LazyListPrefetchScope.onScroll(delta: Float, layoutInfo: LazyListLayoutInfo) = Unit\n    override fun LazyListPrefetchScope.onVisibleItemsUpdated(layoutInfo: LazyListLayoutInfo) = Unit\n    override fun NestedPrefetchScope.onNestedPrefetch(firstVisibleItemIndex: Int) = Unit\n}\n\n@Composable\ninternal fun rememberReaderChapterListState(): LazyListState =\n    remember { LazyListState(prefetchStrategy = ReaderChapterNoPrefetchStrategy) }\n''')

          panel = Path('apps/android/app/src/main/java/com/junchen/jingdu/ReaderSmartChaptersPanel.kt')
          text = panel.read_text()
          import_anchor = 'import androidx.compose.foundation.lazy.rememberLazyListState\n'
          assert text.count(import_anchor) == 1, 'chapter lazy-state import anchor mismatch'
          text = text.replace(import_anchor, '')
          state_anchor = '    val listState = rememberLazyListState()\n'
          assert text.count(state_anchor) == 1, 'chapter list-state anchor mismatch'
          text = text.replace(state_anchor, '    val listState = rememberReaderChapterListState()\n')
          panel.write_text(text)

          contract = Path('scripts/verify-reader.sh')
          text = contract.read_text()
          required_anchor = '  apps/android/app/src/main/java/com/junchen/jingdu/ReaderSmartChaptersPanel.kt\n'
          assert text.count(required_anchor) == 1, 'Reader helper required-file anchor mismatch'
          text = text.replace(required_anchor, required_anchor + '  apps/android/app/src/main/java/com/junchen/jingdu/ReaderChapterListState.kt\n')
          variable_anchor = 'smart_panel=apps/android/app/src/main/java/com/junchen/jingdu/ReaderSmartChaptersPanel.kt\n'
          assert text.count(variable_anchor) == 1, 'Reader helper variable anchor mismatch'
          text = text.replace(variable_anchor, variable_anchor + 'chapter_list_state=apps/android/app/src/main/java/com/junchen/jingdu/ReaderChapterListState.kt\n')
          state_contract = 'require_literal "$smart_panel" \'rememberLazyListState()\' \'chapter list state\'\n'
          assert text.count(state_contract) == 1, 'chapter list-state contract anchor mismatch'
          replacement = '''require_literal "$smart_panel" 'rememberReaderChapterListState()' 'chapter list state'\nrequire_literal "$chapter_list_state" 'LazyListPrefetchStrategy' 'chapter no-prefetch strategy'\nrequire_literal "$chapter_list_state" 'onScroll(delta: Float, layoutInfo: LazyListLayoutInfo) = Unit' 'chapter scroll prefetch disabled'\nrequire_literal "$chapter_list_state" 'onVisibleItemsUpdated(layoutInfo: LazyListLayoutInfo) = Unit' 'chapter visible-item prefetch disabled'\nrequire_literal "$chapter_list_state" 'onNestedPrefetch(firstVisibleItemIndex: Int) = Unit' 'chapter nested prefetch disabled'\n'''
          text = text.replace(state_contract, replacement)
          contract.write_text(text)
          PY

          git diff --check
          bash scripts/verify-reader.sh
          python3 scripts/verify-reader-profile-contract.py
          python3 scripts/test-android-performance-slo.py
      - name: Commit validated product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/android/app/src/main/java/com/junchen/jingdu/ReaderChapterListState.kt \
            apps/android/app/src/main/java/com/junchen/jingdu/ReaderSmartChaptersPanel.kt \
            scripts/verify-reader.sh
          git commit -m 'perf: disable chapter list prefetch contention'
          git push origin HEAD:release/source-v2.3.2
