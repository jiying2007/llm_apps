plugins {
    id "java-library"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ["../../prototype/core/src/main/java"]
        }
    }
    test {
        java {
            srcDirs = ["../../prototype/core/src/test/java"]
        }
    }
}

tasks.register("runPrototypeTests", JavaExec) {
    group = "verification"
    description = "Runs dependency-free core prototype scenarios."
    dependsOn(testClasses)
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.jingdu.txt.core.CorePrototypeTest"
}

tasks.register("generateMalformedNavigationFixture", JavaExec) {
    group = "verification"
    description = "Generates the deterministic malformed UTF-8 Android smoke fixture."
    dependsOn(testClasses)
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.jingdu.txt.core.MalformedNavigationFixtureGenerator"
    args(layout.buildDirectory.dir("device-smoke").get().asFile.absolutePath)
}

tasks.register("largeFileBenchmark", JavaExec) {
    group = "verification"
    description = "Runs the host streaming benchmark; use -PsizeMiB=100 to select a size."
    dependsOn(testClasses)
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.jingdu.txt.core.LargeFileBenchmark"
    args(providers.gradleProperty("sizeMiB").getOrElse("10"))
}

tasks.register("diskIndexBenchmark", JavaExec) {
    group = "verification"
    description = "Runs the disk index benchmark; use -PsizeMiB and -PchapterCount."
    dependsOn(testClasses)
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.jingdu.txt.core.DiskIndexBenchmark"
    args(providers.gradleProperty("sizeMiB").getOrElse("10"),
            providers.gradleProperty("chapterCount").getOrElse("1000"))
}

tasks.register("repairFileBenchmark", JavaExec) {
    group = "verification"
    description = "Runs the full-file repair benchmark; use -PsizeMiB to select a size."
    dependsOn(testClasses)
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.jingdu.txt.core.RepairFileBenchmark"
    args(providers.gradleProperty("sizeMiB").getOrElse("10"),
            providers.gradleProperty("excludeCount").getOrElse("0"))
    jvmArgs("-Xmx128m")
}
