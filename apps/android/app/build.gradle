plugins {
    id "com.android.application"
}

def configuredApplicationId = providers.gradleProperty("jingduApplicationId")
        .getOrElse("com.junchen.jingdu")
def versionCodeProperty = providers.gradleProperty("jingduVersionCode")
def configuredVersionCode = versionCodeProperty
        .map { Integer.parseInt(it) }.getOrElse(1)
def versionNameProperty = providers.gradleProperty("jingduVersionName")
def configuredVersionName = versionNameProperty
        .getOrElse("1.0.0")
def signingPropertiesFile = rootProject.file("keystore.properties")
def signingProperties = new Properties()
def signingSecretsAllowed = !gradle.startParameter.configurationCacheRequested
if (signingSecretsAllowed && signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def signingKeys = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
def releaseSigningConfigured = signingSecretsAllowed && signingPropertiesFile.isFile()
        && signingKeys.every { key ->
            def value = signingProperties.getProperty(key)
            value != null && !value.trim().isEmpty()
        }

android {
    namespace = "com.junchen.jingdu"
    compileSdk = 36

    defaultConfig {
        applicationId = configuredApplicationId
        minSdk = 26
        targetSdk = 36
        versionCode = configuredVersionCode
        versionName = configuredVersionName
        testInstrumentationRunner =
                "com.junchen.jingdu.CoreRuntimeInstrumentation"
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile = file(signingProperties.getProperty("storeFile"))
                storePassword = signingProperties.getProperty("storePassword")
                keyAlias = signingProperties.getProperty("keyAlias")
                keyPassword = signingProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
            resValue "string", "app_name", "净读 TXT Debug"
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
            if (releaseSigningConfigured) {
                signingConfig = signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(":core")
}

tasks.register("validateStoreRelease") {
    group = "verification"
    description = "Rejects placeholder identity, beta versioning, or absent upload signing."
    doLast {
        if (configuredApplicationId == "com.jingdu.txt.w0"
                || configuredApplicationId.endsWith(".w0")) {
            throw new GradleException("set a final non-W0 -PjingduApplicationId")
        }
        if (!(configuredApplicationId ==~ /[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+/)) {
            throw new GradleException("jingduApplicationId is not a canonical package name")
        }
        if (configuredApplicationId.startsWith("com.example.")) {
            throw new GradleException("jingduApplicationId must not use the example namespace")
        }
        if (!versionCodeProperty.isPresent() || configuredVersionCode <= 0) {
            throw new GradleException("set an explicit positive -PjingduVersionCode")
        }
        if (!versionNameProperty.isPresent()
                || configuredVersionName.toLowerCase(Locale.ROOT).contains("beta")
                || configuredVersionName.toLowerCase(Locale.ROOT).contains("w0")) {
            throw new GradleException("set a production -PjingduVersionName")
        }
        if (gradle.startParameter.configurationCacheRequested) {
            throw new GradleException(
                    "run androidStoreCheck with --no-configuration-cache to protect signing secrets")
        }
        if (!releaseSigningConfigured) {
            throw new GradleException("configure ignored keystore.properties for upload signing")
        }
        if (!file(signingProperties.getProperty("storeFile")).isFile()) {
            throw new GradleException("configured upload keystore does not exist")
        }
    }
}
