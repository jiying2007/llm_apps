plugins {
    id "java-library"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ["../../../core/src/main/java"]
        }
    }
    test {
        java {
            srcDirs = ["../../../core/src/test/java"]
        }
    }
}

tasks.register("runCoreTests", JavaExec) {
    group = "verification"
    description = "Runs the platform-independent core regression suite."
    dependsOn(testClasses)
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.jingdu.txt.core.CorePrototypeTest"
}

tasks.register("generateMalformedNavigationFixture", JavaExec) {
    group = "verification"
    dependsOn(testClasses)
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.jingdu.txt.core.MalformedNavigationFixtureGenerator"
    args(layout.buildDirectory.dir("device-smoke").get().asFile.absolutePath)
}

tasks.register("largeFileBenchmark", JavaExec) {
    group = "verification"
    dependsOn(testClasses)
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.jingdu.txt.core.LargeFileBenchmark"
    args(providers.gradleProperty("sizeMiB").getOrElse("10"))
}

tasks.register("diskIndexBenchmark", JavaExec) {
    group = "verification"
    dependsOn(testClasses)
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.jingdu.txt.core.DiskIndexBenchmark"
    args(providers.gradleProperty("sizeMiB").getOrElse("10"),
            providers.gradleProperty("chapterCount").getOrElse("1000"))
}

tasks.register("repairFileBenchmark", JavaExec) {
    group = "verification"
    dependsOn(testClasses)
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.jingdu.txt.core.RepairFileBenchmark"
    args(providers.gradleProperty("sizeMiB").getOrElse("10"),
            providers.gradleProperty("excludeCount").getOrElse("0"))
    jvmArgs("-Xmx128m")
}
